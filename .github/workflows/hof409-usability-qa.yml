name: HOF409 usability QA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Wait for production usability layer
        run: |
          ok=0
          for i in $(seq 1 60); do
            if curl -fsSL "https://corp.kortex10x.com/ari/trading/live.html?qa=$GITHUB_SHA" | grep -q 'ari-chart-usability-v2.js'; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
      - name: Run physical browser QA
        run: |
          mkdir -p "$RUNNER_TEMP/hof409qa" && cd "$RUNNER_TEMP/hof409qa"
          npm init -y >/dev/null 2>&1
          npm install puppeteer@24.16.0 --no-audit --no-fund >/dev/null 2>&1
          cat > qa.mjs <<'JS'
          import puppeteer from 'puppeteer';
          import fs from 'node:fs';
          const A=(v,m)=>{if(!v)throw new Error(m)}, sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const browser=await puppeteer.launch({headless:true,args:['--no-sandbox']});
          const page=await browser.newPage(); await page.setViewport({width:1280,height:900});
          const pageErrors=[],httpErrors=[];
          page.on('pageerror',e=>pageErrors.push(String(e)));
          page.on('response',r=>{if(r.status()>=400)httpErrors.push({status:r.status(),url:r.url()})});
          const base='https://corp.kortex10x.com';
          await page.goto(base+'/ari/?qa=hof409',{waitUntil:'networkidle2',timeout:60000});
          await page.evaluate(async()=>{if('serviceWorker'in navigator)await navigator.serviceWorker.ready});
          await page.reload({waitUntil:'networkidle2',timeout:60000});
          const sw=await page.evaluate(()=>!!navigator.serviceWorker.controller); A(sw,'PWA no controlada');
          await page.goto(base+'/ari/trading/?qa=hof409',{waitUntil:'networkidle2',timeout:60000});
          await page.waitForFunction(()=>!!window.ARI_TRADING_ENGINE_ROUTER,{timeout:30000});
          await page.click('[data-go="live"]');
          await page.waitForFunction(()=>location.pathname==='/ari/trading/live.html'&&window.__ariEngine?.candles?.length>20,{timeout:60000}); await sleep(700);
          const initial=await page.evaluate(()=>({api:ARI_CHART_API.version,feed:ARI_CHART_API.getFeedState(),iframes:document.querySelectorAll('iframe').length,modes:document.querySelectorAll('[data-doc-mode]').length,cta:document.getElementById('docSave')?.textContent.trim(),toolbar:[...document.querySelectorAll('.ari-drawbar button')].map(x=>x.title),shell:document.querySelector('.brand')?.textContent.trim()}));
          A(initial.api==='1.1.0','API usabilidad'); A(initial.feed.source.includes('BIQUOTE')&&initial.feed.candles>20,'feed'); A(initial.iframes===0,'iframe TV'); A(initial.modes===3&&initial.cta==='GUARDAR EN NOTION','panel'); A(initial.toolbar.length>=8,'toolbar'); A(initial.shell==='A.R.I. · TRADING','shell');
          const canvas=await page.$('#ariChartCanvas'), box=await canvas.boundingBox(); A(box&&box.width>500&&box.height>400,'canvas');
          const L=await page.evaluate(()=>__ariEngine._layout()), px=box.x+L.cw*.55, py=box.y+L.top+L.ch*.45;
          const ps0=await page.evaluate(()=>__ariEngine.priceScaleFactor||1), sx=box.x+L.cw+30, sy=box.y+L.top+L.ch*.55;
          await page.mouse.move(sx,sy); await page.mouse.down(); await page.mouse.move(sx,sy-85,{steps:8}); await page.mouse.up(); const ps1=await page.evaluate(()=>__ariEngine.priceScaleFactor||1); A(ps1>ps0*1.25,'price scale drag');
          await page.click('#ariAutoscale'); const ts0=await page.evaluate(()=>__ariEngine.visibleCount), tx=box.x+L.cw*.55, ty=box.y+L.top+L.ch+18;
          await page.mouse.move(tx,ty); await page.mouse.down(); await page.mouse.move(tx+130,ty,{steps:8}); await page.mouse.up(); const ts1=await page.evaluate(()=>__ariEngine.visibleCount); A(ts1<ts0,'time scale drag');
          await page.click('#ariAutoscale'); await page.mouse.move(px,py); await page.mouse.down(); await page.mouse.move(px-150,py,{steps:8}); await page.mouse.up(); const pf=await page.evaluate(()=>__ariEngine.panOffset); A(pf<0,'future pan');
          await page.mouse.move(px-150,py); await page.mouse.down(); await page.mouse.move(px+220,py,{steps:12}); await page.mouse.up(); const ph=await page.evaluate(()=>__ariEngine.panOffset); A(ph>0,'history pan');
          await page.click('#ariAutoscale'); await page.evaluate(()=>{localStorage.removeItem('ari-chart-drawings-v1:XAUUSD:default');__ariEngine.drawings=[];__ariEngine.render()});
          await page.click('[data-tool="horizontal"]'); await page.mouse.click(px,py); const one=await page.evaluate(()=>({n:__ariEngine.drawings.length,t:__ariEngine.drawings[0]?.type,tool:__ariEngine.tool})); A(one.n===1&&one.t==='horizontal'&&one.tool==='cursor','horizontal one-shot');
          const line=await page.evaluate(()=>{const e=__ariEngine,a=e._visible(),L=e._layout(),S=e._scale(a),M=e._maps(a,L,S),d=e.drawings[0];return{id:d.id,y:M.y(d.p1.p),p:d.p1.p,cw:L.cw}}), lx=box.x+line.cw*.45,ly=box.y+line.y;
          await page.mouse.move(lx,ly); await page.mouse.down(); await page.mouse.move(lx,ly+55,{steps:8}); await page.mouse.up(); const moved=await page.evaluate(()=>({id:__ariEngine.selectedDrawingId,p:__ariEngine.drawings[0].p1.p,disabled:document.querySelector('[data-action="delete-selected"]').disabled})); A(moved.id===line.id&&Math.abs(moved.p-line.p)>.01&&!moved.disabled,'select/move');
          await page.click('[data-action="delete-selected"]'); A(await page.evaluate(()=>__ariEngine.drawings.length===0),'delete selected');
          await page.click('[data-tool="trend"]'); await page.mouse.move(px-90,py-50); await page.mouse.down(); await page.mouse.move(px+80,py+40,{steps:6}); await page.keyboard.press('Escape'); await page.mouse.up(); const esc=await page.evaluate(()=>({n:__ariEngine.drawings.length,tool:__ariEngine.tool,drag:__ariEngine.drag,preview:__ariEngine.preview})); A(esc.n===0&&esc.tool==='cursor'&&!esc.drag&&!esc.preview,'ESC');
          await page.click('[data-tool="trend"]'); await page.mouse.move(px-100,py-50); await page.mouse.down(); await page.mouse.move(px+100,py+45,{steps:8}); await page.mouse.up(); A(await page.evaluate(()=>__ariEngine.drawings.length===1&&__ariEngine.tool==='cursor'),'trend one-shot');
          await page.reload({waitUntil:'networkidle2',timeout:60000}); await page.waitForFunction(()=>__ariEngine?.candles?.length>20,{timeout:60000}); const persisted=await page.evaluate(()=>__ariEngine.drawings.map(x=>x.type)); A(persisted.length===1&&persisted[0]==='trend','drawing persistence'); await page.evaluate(()=>__ariEngine.clearDrawings());
          const tfs={}; for(const tf of ['M1','M5','M15','H1','H4']){await page.evaluate(t=>ARI_CHART_API.setTimeframe(t),tf);await page.waitForFunction(t=>__ariEngine.tf===t&&__ariEngine.candles.length>20,{timeout:60000},tf);await sleep(300);tfs[tf]=await page.evaluate(()=>({tf:__ariEngine.tf,clock:document.querySelector('#ariPriceClock b').textContent,source:__ariEngine.source}));A(tfs[tf].tf===tf&&tfs[tf].clock===tf&&tfs[tf].source.includes('BIQUOTE'),'tf '+tf)}
          await page.click('#ariFullscreen'); await sleep(250); A(await page.evaluate(()=>!!document.fullscreenElement),'fullscreen'); await page.evaluate(()=>document.exitFullscreen());
          await page.setViewport({width:390,height:844}); await sleep(400); const mobile=await page.evaluate(()=>({body:document.body.scrollWidth,inner:innerWidth,chart:document.getElementById('ariChartCanvas').getBoundingClientRect().width,toolbar:document.querySelectorAll('.ari-drawbar button').length})); A(mobile.body<=mobile.inner+1&&mobile.chart>250&&mobile.toolbar>=8,'mobile');
          const criticalHttp=httpErrors.filter(x=>/ari-chart|ari-trading-feed|live-panel|\/ari\/trading\/live\.html/.test(x.url)); A(pageErrors.length===0,'pageerror '+pageErrors.join(' | ')); A(criticalHttp.length===0,'critical HTTP '+JSON.stringify(criticalHttp));
          const result={ok:true,sw,initial,priceScale:{before:ps0,after:ps1},timeScale:{before:ts0,after:ts1},pan:{future:pf,history:ph},oneShot:one,moved,esc,persisted,tfs,mobile,pageErrors,httpErrors};
          fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/hof409-usability-qa.json',JSON.stringify(result,null,2)); console.log(JSON.stringify(result,null,2)); await browser.close();
          JS
          node qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hof409-usability-qa
          path: hof409-usability-qa.json
          if-no-files-found: ignore
