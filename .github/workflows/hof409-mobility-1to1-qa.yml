name: HOF409 mobility 1to1 QA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Wait for production v3
        run: |
          ok=0
          for i in $(seq 1 60); do
            if curl -fsSL "https://corp.kortex10x.com/ari/trading/live.html?qa=$GITHUB_SHA" | grep -q 'ari-chart-mobility-v3.js'; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
      - name: Physical browser QA
        run: |
          mkdir -p "$RUNNER_TEMP/hof409qa" && cd "$RUNNER_TEMP/hof409qa"
          npm init -y >/dev/null 2>&1
          npm install puppeteer@24.16.0 --no-audit --no-fund >/dev/null 2>&1
          cat > qa.mjs <<'JS'
          import puppeteer from 'puppeteer';
          import fs from 'node:fs';
          const A=(v,m)=>{if(!v)throw new Error(m)}, sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const browser=await puppeteer.launch({headless:true,args:['--no-sandbox']});
          const page=await browser.newPage();await page.setViewport({width:1280,height:900,deviceScaleFactor:1});
          const pageErrors=[],httpErrors=[];page.on('pageerror',e=>pageErrors.push(String(e)));page.on('response',r=>{if(r.status()>=400)httpErrors.push({status:r.status(),url:r.url()})});
          const base='https://corp.kortex10x.com';
          await page.goto(base+'/ari/?qa=hof409-1to1',{waitUntil:'networkidle2',timeout:60000});
          await page.evaluate(async()=>{if('serviceWorker'in navigator)await navigator.serviceWorker.ready});await page.reload({waitUntil:'networkidle2',timeout:60000});
          A(await page.evaluate(()=>!!navigator.serviceWorker.controller),'PWA no controlada');
          await page.goto(base+'/ari/trading/?qa=hof409-1to1',{waitUntil:'networkidle2',timeout:60000});await page.waitForFunction(()=>!!window.ARI_TRADING_ENGINE_ROUTER,{timeout:30000});await page.click('[data-go="live"]');
          await page.waitForFunction(()=>location.pathname==='/ari/trading/live.html'&&window.__ariEngine?.candles?.length>20&&window.ARI_CHART_API?.version==='1.2.0',{timeout:60000});await sleep(700);
          const init=await page.evaluate(()=>({api:ARI_CHART_API.version,feed:ARI_CHART_API.getFeedState(),iframe:document.querySelectorAll('iframe').length,modes:document.querySelectorAll('[data-doc-mode]').length,cta:document.getElementById('docSave')?.textContent.trim(),shell:document.querySelector('.brand')?.textContent.trim(),toolbar:document.querySelectorAll('.ari-drawbar button').length}));
          A(init.api==='1.2.0','API v3 ausente');A(init.feed.source.includes('BIQUOTE')&&init.feed.candles>20,'feed real');A(init.iframe===0,'iframe regresó');A(init.modes===3&&init.cta==='GUARDAR EN NOTION','panel');A(init.shell==='A.R.I. · TRADING','shell');A(init.toolbar>=8,'toolbar');
          const canvas=await page.$('#ariChartCanvas'),box=await canvas.boundingBox();A(box&&box.width>500&&box.height>400,'canvas');
          const L=await page.evaluate(()=>__ariEngine._layout()),x=box.x+L.cw*.52,y=box.y+L.top+L.ch*.45;
          async function marker(){return page.evaluate(()=>{const e=__ariEngine,a=e.candles,L=e._layout(),S=e._scale(e._visible()),M=e._maps(e._visible(),L,S),d=a[Math.max(0,a.length-35)];return{t:d.t,x:M.x(d.t),pan:e.panOffset,viewport:e._viewportIndexes()}})}
          await page.click('#ariAutoscale');let m0=await marker();
          const dx1=123;await page.mouse.move(x,y);await page.mouse.down();await page.mouse.move(x+dx1,y,{steps:12});await page.mouse.up();let m1=await marker();const shift1=m1.x-m0.x;A(Math.abs(shift1-dx1)<1.25,`pan 1:1 derecha ${shift1} != ${dx1}`);A(!Number.isInteger(m1.pan),'pan sigue cuantizado');
          await page.click('#ariAutoscale');m0=await marker();const dx2=-97;await page.mouse.move(x,y);await page.mouse.down();await page.mouse.move(x+dx2,y,{steps:10});await page.mouse.up();m1=await marker();const shift2=m1.x-m0.x;A(Math.abs(shift2-dx2)<1.25,`pan 1:1 izquierda ${shift2} != ${dx2}`);A(m1.pan<0,'no crea espacio futuro');
          // Repite 1:1 con zoom horizontal cambiado.
          await page.click('#ariAutoscale');const tx=box.x+L.cw*.55,ty=box.y+L.top+L.ch+18;await page.mouse.move(tx,ty);await page.mouse.down();await page.mouse.move(tx+120,ty,{steps:8});await page.mouse.up();const zoomCount=await page.evaluate(()=>__ariEngine.visibleCount);A(zoomCount<80,'zoom temporal');m0=await marker();const dx3=71;await page.mouse.move(x,y);await page.mouse.down();await page.mouse.move(x+dx3,y,{steps:8});await page.mouse.up();m1=await marker();const shift3=m1.x-m0.x;A(Math.abs(shift3-dx3)<1.25,`pan 1:1 zoom ${shift3} != ${dx3}`);
          // Cromado: el viejo marrón #28241e / rgb(40,36,30) no debe quedar en contador; dark del motor debe ser gris neutro.
          await page.evaluate(()=>ARI_THEME.set('sepia'));await sleep(150);const sepia=await page.evaluate(()=>{const c=getComputedStyle(document.querySelector('.ari-price-clock')),eng=getComputedStyle(document.querySelector('.ari-chart-engine'));return{clockBg:c.backgroundColor,clockColor:c.color,panel:eng.getPropertyValue('--panel').trim()}});A(sepia.clockBg==='rgb(247, 239, 227)','contador sepia no limpio '+sepia.clockBg);A(sepia.clockBg!=='rgb(40, 36, 30)','marrón oscuro sigue en contador');
          await page.evaluate(()=>ARI_THEME.set('dark'));await sleep(150);const dark=await page.evaluate(()=>{const c=getComputedStyle(document.querySelector('.ari-price-clock')),eng=getComputedStyle(document.querySelector('.ari-chart-engine'));return{clockBg:c.backgroundColor,panel:eng.getPropertyValue('--panel').trim(),chart:eng.getPropertyValue('--chart-sepia').trim()}});A(dark.clockBg==='rgb(21, 21, 21)','contador dark no neutro '+dark.clockBg);A(dark.panel==='#101010'&&dark.chart==='#090909','motor dark conserva tinte marrón '+JSON.stringify(dark));
          await page.evaluate(()=>ARI_THEME.set('red-night'));await sleep(150);const red=await page.evaluate(()=>getComputedStyle(document.querySelector('.ari-price-clock')).backgroundColor);A(red==='rgb(22, 2, 2)','rojo noche regresó');
          await page.evaluate(()=>ARI_THEME.set('sepia'));await sleep(100);
          // TF/contador/dibujos/fullscreen siguen intactos.
          for(const tf of ['M1','M5','M15','H1','H4']){await page.evaluate(t=>ARI_CHART_API.setTimeframe(t),tf);await page.waitForFunction(t=>__ariEngine.tf===t&&__ariEngine.candles.length>20,{timeout:60000},tf);await sleep(250);const s=await page.evaluate(()=>({tf:__ariEngine.tf,clock:document.querySelector('#ariPriceClock b').textContent,source:__ariEngine.source}));A(s.tf===tf&&s.clock===tf&&s.source.includes('BIQUOTE'),'TF '+tf)}
          await page.evaluate(()=>{__ariEngine.clearDrawings();ARI_CHART_API.createDrawing({type:'horizontal',p1:{t:__ariEngine.candles.at(-20).t,p:__ariEngine.candles.at(-20).c}})});A(await page.evaluate(()=>__ariEngine.drawings.length===1),'drawing create');await page.reload({waitUntil:'networkidle2',timeout:60000});await page.waitForFunction(()=>__ariEngine?.candles?.length>20,{timeout:60000});A(await page.evaluate(()=>__ariEngine.drawings.length===1),'drawing persistence');await page.evaluate(()=>__ariEngine.clearDrawings());
          await page.click('#ariFullscreen');await sleep(200);A(await page.evaluate(()=>!!document.fullscreenElement),'fullscreen');await page.evaluate(()=>document.exitFullscreen());
          await page.setViewport({width:390,height:844});await sleep(350);const mobile=await page.evaluate(()=>({body:document.body.scrollWidth,inner:innerWidth,chart:document.getElementById('ariChartCanvas').getBoundingClientRect().width}));A(mobile.body<=mobile.inner+1&&mobile.chart>250,'mobile');
          const critical=httpErrors.filter(x=>/ari-chart|ari-trading-feed|live-panel|\/ari\/trading\/live\.html/.test(x.url));A(pageErrors.length===0,'page errors '+pageErrors.join('|'));A(critical.length===0,'critical http '+JSON.stringify(critical));
          const result={ok:true,init,pan1to1:{right:{requested:dx1,actual:shift1,pan:m1.pan},left:{requested:dx2,actual:shift2},zoom:{visibleCount:zoomCount,requested:dx3,actual:shift3}},themes:{sepia,dark,red},mobile,pageErrors,httpErrors};fs.writeFileSync(process.env.GITHUB_WORKSPACE+'/hof409-mobility-1to1-qa.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result,null,2));await browser.close();
          JS
          node qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hof409-mobility-1to1-qa
          path: hof409-mobility-1to1-qa.json
          if-no-files-found: ignore
