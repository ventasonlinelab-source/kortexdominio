name: HOF409 final usability QA
on:
  push:
    branches: [main]
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify exact production bytes
        run: |
          set -e
          curl -fsSL 'https://corp.kortex10x.com/ari/sw.js?qa=hof409-final-usability' | grep -q "ari-v64"
          curl -fsSL 'https://corp.kortex10x.com/ari/trading/live.html?qa=hof409-final-usability' | grep -q 'ari-chart-final-usability-v1.js?v=2'
          curl -fsSL 'https://corp.kortex10x.com/ari/trading/ari-chart-final-usability-v1.js?v=2&qa=hof409-final-usability' | grep -q "version:'1.3.0'"
          curl -fsSL 'https://corp.kortex10x.com/ari/trading/ari-chart-final-usability-v1.js?v=2&qa=hof409-final-usability' | grep -q 'pricePanRatio'
          curl -fsSL 'https://corp.kortex10x.com/ari/trading/ari-chart-final-usability-v1.js?v=2&qa=hof409-final-usability' | grep -q 'ari-favorites-bar'
      - name: Exercise real PWA and chart interactions
        run: |
          mkdir -p "$RUNNER_TEMP/hof409final" "$GITHUB_WORKSPACE/hof409-final-usability"
          cd "$RUNNER_TEMP/hof409final"
          npm init -y >/dev/null 2>&1
          npm install puppeteer@24.16.0 --no-audit --no-fund >/dev/null 2>&1
          cat > qa.mjs <<'JS'
          import puppeteer from 'puppeteer';
          import fs from 'node:fs';
          const A=(v,m)=>{if(!v)throw new Error(m)};const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const out=process.env.GITHUB_WORKSPACE+'/hof409-final-usability';fs.mkdirSync(out,{recursive:true});
          const browser=await puppeteer.launch({headless:true,args:['--no-sandbox']});
          const page=await browser.newPage();await page.setViewport({width:1280,height:900,deviceScaleFactor:1});
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('https://corp.kortex10x.com/ari/?source=pwa',{waitUntil:'networkidle2',timeout:60000});
          await page.evaluate(()=>{localStorage.setItem('ari-theme','dark');localStorage.removeItem('ari-chart-tool-favorites-v1:XAUUSD');localStorage.removeItem('ari-chart-favorites-pos-v1:XAUUSD')});
          await page.evaluate(async()=>{const r=await navigator.serviceWorker.ready;await r.update();await new Promise(x=>setTimeout(x,800))});
          await page.reload({waitUntil:'networkidle2',timeout:60000});
          await page.waitForFunction(()=>navigator.serviceWorker.controller&&document.documentElement.dataset.theme==='dark',{timeout:30000});
          const cachesNow=await page.evaluate(async()=>await caches.keys());A(cachesNow.includes('ari-v64'),'PWA cache not v64: '+cachesNow.join(','));
          const menu=await page.evaluate(()=>{const x=[...document.querySelectorAll('.nav')].find(e=>e.textContent.includes('Menú'));if(!x)return false;x.click();return true});A(menu,'Menú missing');
          await page.waitForSelector('[data-dashboard-route="/ari/trading/"]',{timeout:15000});await page.click('[data-dashboard-route="/ari/trading/"]');
          await page.waitForFunction(()=>location.pathname==='/ari/trading/',{timeout:30000});await page.click('[data-go="live"]');
          await page.waitForFunction(()=>location.pathname==='/ari/trading/live.html'&&window.__ariEngine?.candles?.length>20&&window.ARI_CHART_API?.version==='1.3.0',{timeout:60000});await sleep(700);
          const base=await page.evaluate(()=>({api:ARI_CHART_API.version,feed:ARI_CHART_API.getFeedState(),iframe:document.querySelectorAll('iframe').length,modes:document.querySelectorAll('[data-doc-mode]').length,stars:document.querySelectorAll('.ari-fav-toggle').length,bar:!!document.querySelector('.ari-favorites-bar'),theme:document.documentElement.dataset.theme}));
          A(base.api==='1.3.0','API wrong '+base.api);A(base.feed?.source?.includes('BIQUOTE'),'feed not BIQUOTE '+JSON.stringify(base.feed));A(base.iframe===0,'iframe regression');A(base.modes===3,'documentation modes regression');A(base.stars===5,'favorite stars missing '+base.stars);A(base.bar&&base.theme==='dark','favorite bar/theme missing');

          // Favorites via public API -> floating toolbar -> persistence after reload.
          const favSet=await page.evaluate(()=>ARI_CHART_API.setFavoriteTools(['horizontal','rect']));A(JSON.stringify(favSet)===JSON.stringify(['horizontal','rect']),'favorite API set failed '+JSON.stringify(favSet));
          let favState=await page.evaluate(()=>({api:ARI_CHART_API.getFavoriteTools(),dom:[...document.querySelectorAll('[data-favorite-tool]')].map(x=>x.dataset.favoriteTool),stored:JSON.parse(localStorage.getItem('ari-chart-tool-favorites-v1:XAUUSD')||'[]')}));
          A(favState.api.length===2&&favState.dom.length===2&&favState.stored.length===2,'favorites not materialized '+JSON.stringify(favState));
          await page.click('[data-favorite-tool="horizontal"]');A(await page.evaluate(()=>__ariEngine.tool==='horizontal'),'favorite tool button does not select tool');await page.evaluate(()=>__ariEngine.setTool('cursor'));
          await page.click('[data-tool="trend"] .ari-fav-toggle');A((await page.evaluate(()=>ARI_CHART_API.getFavoriteTools())).includes('trend'),'star toggle did not add trend');A(await page.evaluate(()=>__ariEngine.tool==='cursor'),'star click leaked into tool selection');await page.click('[data-tool="trend"] .ari-fav-toggle');A(!(await page.evaluate(()=>ARI_CHART_API.getFavoriteTools())).includes('trend'),'star toggle did not remove trend');
          await page.screenshot({path:out+'/01-live-favorites-desktop.png',fullPage:true});

          // Floating favorite toolbar is draggable and position persists.
          const grip=await page.$('.ari-favorites-grip');const gbox=await grip.boundingBox();A(gbox,'favorite grip has no box');await page.mouse.move(gbox.x+gbox.width/2,gbox.y+gbox.height/2);await page.mouse.down();await page.mouse.move(gbox.x+gbox.width/2+90,gbox.y+gbox.height/2+46,{steps:10});await page.mouse.up();await sleep(100);
          const posSaved=await page.evaluate(()=>JSON.parse(localStorage.getItem('ari-chart-favorites-pos-v1:XAUUSD')||'null'));A(posSaved&&posSaved.x>50&&posSaved.y>20,'favorite position not saved '+JSON.stringify(posSaved));
          await page.reload({waitUntil:'networkidle2',timeout:60000});await page.waitForFunction(()=>window.__ariEngine?.candles?.length>20&&window.ARI_CHART_API?.version==='1.3.0',{timeout:60000});await sleep(400);
          favState=await page.evaluate(()=>({api:ARI_CHART_API.getFavoriteTools(),dom:[...document.querySelectorAll('[data-favorite-tool]')].map(x=>x.dataset.favoriteTool),pos:JSON.parse(localStorage.getItem('ari-chart-favorites-pos-v1:XAUUSD')||'null'),left:parseFloat(getComputedStyle(document.querySelector('.ari-favorites-bar')).left),top:parseFloat(getComputedStyle(document.querySelector('.ari-favorites-bar')).top)}));
          A(JSON.stringify(favState.api)===JSON.stringify(['horizontal','rect'])&&favState.dom.length===2,'favorites did not survive reload '+JSON.stringify(favState));A(Math.abs(favState.left-favState.pos.x)<3&&Math.abs(favState.top-favState.pos.y)<3,'favorite bar position did not restore '+JSON.stringify(favState));

          // Real intra-chart vertical movement: drag plot down and require price geometry to move ~same pixels.
          await page.evaluate(()=>ARI_CHART_API.resetView());
          const metric=()=>page.evaluate(()=>{const e=__ariEngine,a=e._visible(),L=e._layout(),S=e._scale(a),M=e._maps(a,L,S),last=e.candles[e.candles.length-1],r=e.canvas.getBoundingClientRect();return{state:ARI_CHART_API.getFreePanState(),y:M.y(last.c),cw:L.cw,ch:L.ch,rect:{x:r.x,y:r.y,w:r.width,h:r.height},free:e.wrap.classList.contains('is-free-panning')}});
          const v0=await metric(),vx=v0.rect.x+Math.min(v0.cw-80,v0.cw*.60),vy=v0.rect.y+Math.min(v0.ch-100,v0.ch*.48),VDY=84;
          await page.mouse.move(vx,vy);await page.mouse.down();await page.mouse.move(vx,vy+VDY,{steps:12});await page.mouse.up();await sleep(80);const v1=await metric();
          const yDelta=v1.y-v0.y;A(Math.abs(v1.state.panOffset-v0.state.panOffset)<0.05,'vertical pan changed time offset '+JSON.stringify({v0:v0.state,v1:v1.state}));A(v1.state.pricePanRatio>0.08,'vertical pan did not change price pan '+JSON.stringify(v1.state));A(yDelta>70&&yDelta<98,'vertical candle movement is not 1:1-ish '+yDelta);A(!v1.free,'free-pan cursor class stuck after release');

          // Real intra-chart horizontal movement: drag plot right and require time pan while vertical state stays fixed.
          await page.evaluate(()=>ARI_CHART_API.resetView());const h0=await metric(),hx=h0.rect.x+Math.min(h0.cw-150,h0.cw*.52),hy=h0.rect.y+Math.min(h0.ch-100,h0.ch*.55),HDX=120;
          await page.mouse.move(hx,hy);await page.mouse.down();await page.mouse.move(hx+HDX,hy,{steps:12});await page.mouse.up();await sleep(80);const h1=await metric();
          A(Math.abs(h1.state.panOffset-h0.state.panOffset)>5,'horizontal intra-chart pan did not move time '+JSON.stringify({h0:h0.state,h1:h1.state}));A(Math.abs(h1.state.pricePanRatio-h0.state.pricePanRatio)<0.02,'horizontal pan polluted vertical state '+JSON.stringify(h1.state));A(!h1.free,'free-pan class stuck after horizontal release');

          // AUTO restores both axes.
          await page.click('#ariAutoscale');const auto=await page.evaluate(()=>ARI_CHART_API.getFreePanState());A(Math.abs(auto.panOffset)<1e-6&&Math.abs(auto.pricePanRatio)<1e-6,'AUTO did not reset both axes '+JSON.stringify(auto));
          await page.screenshot({path:out+'/02-live-after-free-pan.png',fullPage:true});

          // Mobile/PWA regression and favorites stay inside chart.
          await page.setViewport({width:390,height:844,deviceScaleFactor:1});await sleep(500);const mobile=await page.evaluate(()=>{const b=document.querySelector('.ari-favorites-bar').getBoundingClientRect(),w=document.querySelector('.ari-canvas-wrap').getBoundingClientRect();return{body:document.body.scrollWidth,inner:innerWidth,bar:{l:b.left,r:b.right,t:b.top,b:b.bottom},wrap:{l:w.left,r:w.right,t:w.top,b:w.bottom},favorites:ARI_CHART_API.getFavoriteTools(),feed:ARI_CHART_API.getFeedState(),modes:document.querySelectorAll('[data-doc-mode]').length}});
          A(mobile.body<=mobile.inner+1,'mobile overflow '+JSON.stringify(mobile));A(mobile.bar.l>=mobile.wrap.l-1&&mobile.bar.r<=mobile.wrap.r+1&&mobile.bar.t>=mobile.wrap.t-1&&mobile.bar.b<=mobile.wrap.b+1,'favorites bar escaped chart on mobile '+JSON.stringify(mobile));A(mobile.favorites.length===2&&mobile.feed?.source?.includes('BIQUOTE')&&mobile.modes===3,'mobile regression '+JSON.stringify(mobile));A(errors.length===0,'page errors '+errors.join('|'));
          await page.screenshot({path:out+'/03-live-mobile.png',fullPage:true});
          const result={ok:true,cache:cachesNow,base,favorites:favState,vertical:{before:v0.state,after:v1.state,yDelta},horizontal:{before:h0.state,after:h1.state},auto,mobile,errors};fs.writeFileSync(out+'/qa.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result,null,2));await browser.close();
          JS
          node qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hof409-final-usability-qa
          path: hof409-final-usability/
          if-no-files-found: error
