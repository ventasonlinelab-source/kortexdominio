name: HOF409 v61 final visual QA
on:
  push:
    branches: [main]
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify v61 in production
        run: |
          set -e
          curl -fsSL 'https://corp.kortex10x.com/ari/sw.js?qa=hof409-v61' | grep -q "ari-v61"
          curl -fsSL 'https://corp.kortex10x.com/ari/sw.js?qa=hof409-v61' | grep -q 'html\[data-theme=\"dark\"\] .send'
          curl -fsSL 'https://corp.kortex10x.com/ari/trading/live.html?qa=hof409-v61' | grep -q 'ari-chart-mobility-v3.js?v=2'
      - name: Render exact Adrián PWA path
        run: |
          mkdir -p "$RUNNER_TEMP/hof409v61" "$GITHUB_WORKSPACE/hof409-v61"
          cd "$RUNNER_TEMP/hof409v61"
          npm init -y >/dev/null 2>&1
          npm install puppeteer@24.16.0 sharp@0.34.3 --no-audit --no-fund >/dev/null 2>&1
          cat > qa.mjs <<'JS'
          import puppeteer from 'puppeteer';
          import sharp from 'sharp';
          import fs from 'node:fs';
          const A=(v,m)=>{if(!v)throw new Error(m)}; const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const out=process.env.GITHUB_WORKSPACE+'/hof409-v61'; fs.mkdirSync(out,{recursive:true});
          const browser=await puppeteer.launch({headless:true,args:['--no-sandbox']});
          const page=await browser.newPage(); await page.setViewport({width:1280,height:900,deviceScaleFactor:1});
          const errors=[]; page.on('pageerror',e=>errors.push(String(e)));
          await page.goto('https://corp.kortex10x.com/ari/?source=pwa',{waitUntil:'networkidle2',timeout:60000});
          await page.evaluate(()=>localStorage.setItem('ari-theme','dark'));
          await page.evaluate(async()=>{const r=await navigator.serviceWorker.ready;await r.update();await new Promise(x=>setTimeout(x,700));});
          await page.reload({waitUntil:'networkidle2',timeout:60000});
          await page.waitForFunction(()=>navigator.serviceWorker.controller&&document.documentElement.dataset.theme==='dark',{timeout:30000});
          const cache=await page.evaluate(async()=>await caches.keys()); A(cache.includes('ari-v61'),'PWA cache not v61 '+cache.join(','));
          const sendBg=await page.evaluate(()=>{const e=document.querySelector('.send');return e?getComputedStyle(e).backgroundColor:null}); A(sendBg==='rgb(32, 32, 32)','AHORA send still non-graphite '+sendBg);
          await page.screenshot({path:out+'/01-pwa-home.png',fullPage:true});
          const menu=await page.evaluate(()=>{const x=[...document.querySelectorAll('.nav')].find(e=>e.textContent.includes('Menú'));if(!x)return false;x.click();return true}); A(menu,'Menú missing');
          await page.waitForSelector('[data-dashboard-route="/ari/trading/"]',{timeout:15000}); await page.click('[data-dashboard-route="/ari/trading/"]');
          await page.waitForFunction(()=>location.pathname==='/ari/trading/',{timeout:30000}); await sleep(500); await page.screenshot({path:out+'/02-trading.png',fullPage:true});
          await page.click('[data-go="live"]');
          await page.waitForFunction(()=>location.pathname==='/ari/trading/live.html'&&window.__ariEngine?.candles?.length>20&&window.ARI_CHART_API?.version==='1.2.0',{timeout:60000}); await sleep(900);
          const state=await page.evaluate(()=>({path:location.pathname,theme:document.documentElement.dataset.theme,sw:!!navigator.serviceWorker.controller,api:ARI_CHART_API.version,feed:ARI_CHART_API.getFeedState(),iframe:document.querySelectorAll('iframe').length,modes:document.querySelectorAll('[data-doc-mode]').length,canvasFilter:getComputedStyle(document.querySelector('#ariChartCanvas')).filter,tfBg:getComputedStyle(document.querySelector('.ari-tf.active')).backgroundColor,toolBg:getComputedStyle(document.querySelector('.ari-tool.active')).backgroundColor}));
          A(state.theme==='dark'&&state.sw&&state.path==='/ari/trading/live.html','wrong PWA/live state');
          A(state.feed?.source?.includes('BIQUOTE'),'feed not BIQUOTE '+JSON.stringify(state.feed)); A(state.iframe===0,'iframe regression'); A(state.modes===3,'doc modes regression'); A(state.canvasFilter==='none','canvas filter regression '+state.canvasFilter); A(state.tfBg==='rgb(36, 36, 36)','TF active not graphite '+state.tfBg); A(state.toolBg==='rgb(36, 36, 36)','tool active not graphite '+state.toolBg);
          await page.screenshot({path:out+'/03-live-desktop.png',fullPage:true});
          await page.setViewport({width:390,height:844,deviceScaleFactor:1}); await sleep(500); await page.screenshot({path:out+'/04-live-mobile.png',fullPage:true});
          const dims=await page.evaluate(()=>({body:document.body.scrollWidth,inner:innerWidth})); A(dims.body<=dims.inner+1,'mobile overflow '+JSON.stringify(dims)); A(errors.length===0,'pageerrors '+errors.join('|'));
          async function stats(file){const {data,info}=await sharp(file).removeAlpha().raw().toBuffer({resolveWithObject:true});const total=info.width*info.height,mask=new Uint8Array(total),seen=new Uint8Array(total);let brown=0;for(let p=0,i=0;p<total;p++,i+=3){const r=data[i],g=data[i+1],b=data[i+2],lum=.2126*r+.7152*g+.0722*b;if(lum<105&&r>=g+4&&g>=b+4&&(r-b)>=10){mask[p]=1;brown++}}let maxComponent=0,components=0;const stack=[];for(let p=0;p<total;p++){if(!mask[p]||seen[p])continue;components++;seen[p]=1;stack.push(p);let n=0;while(stack.length){const q=stack.pop();n++;const x=q%info.width,y=(q-x)/info.width;for(const z of [q-1,q+1,q-info.width,q+info.width]){if(z<0||z>=total||seen[z]||!mask[z])continue;const zx=z%info.width,zy=(z-zx)/info.width;if(Math.abs(zx-x)+Math.abs(zy-y)!==1)continue;seen[z]=1;stack.push(z)}}if(n>maxComponent)maxComponent=n}return{width:info.width,height:info.height,brownPct:+(brown/total*100).toFixed(4),maxBrownComponent:maxComponent,brownComponents:components}}
          const shots={};for(const f of ['01-pwa-home.png','02-trading.png','03-live-desktop.png','04-live-mobile.png'])shots[f]=await stats(out+'/'+f);
          for(const [f,s] of Object.entries(shots))A(s.maxBrownComponent<180,'continuous brown surface in '+f+': '+s.maxBrownComponent+'px');
          const result={ok:true,route:['/ari/?source=pwa','Menú','TRADING','LIVE','/ari/trading/live.html'],cache,sendBg,state,dims,shots,errors}; fs.writeFileSync(out+'/qa.json',JSON.stringify(result,null,2)); console.log(JSON.stringify(result,null,2)); await browser.close();
          JS
          node qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hof409-v61-final-visual-qa
          path: hof409-v61/
          if-no-files-found: error
