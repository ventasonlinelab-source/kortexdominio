name: HOF410 SSH secret presence
on:
  push:
    branches: [hof410-qa-e2e-20260908]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    env:
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
      HETZNER_IP: ${{ secrets.HETZNER_IP }}
      HETZNER_USER: ${{ secrets.HETZNER_USER }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      KORTEX_HOST: ${{ secrets.KORTEX_HOST }}
      KORTEX_USER: ${{ secrets.KORTEX_USER }}
      KORTEX_SSH_KEY: ${{ secrets.KORTEX_SSH_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for n in HETZNER_HOST HETZNER_IP HETZNER_USER HETZNER_SSH_KEY SSH_HOST SSH_USER SSH_PRIVATE_KEY SERVER_HOST SERVER_USER SERVER_SSH_KEY KORTEX_HOST KORTEX_USER KORTEX_SSH_KEY DEPLOY_HOST DEPLOY_USER DEPLOY_KEY; do
            if [ -n "${!n:-}" ]; then echo "PRESENT=$n"; found=1; fi
          done
          echo "ANY_SSH_SECRET=$found"
