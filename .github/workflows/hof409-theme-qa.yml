name: HOF-409 Theme QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hof409-theme-qa.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify LIVE chart in 3 themes
        env:
          BASE: https://corp.kortex10x.com
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:1280,height:900}});
            const page=await ctx.newPage();
            await page.goto(process.env.BASE+'/ari/',{waitUntil:'networkidle',timeout:60000});
            await page.evaluate(()=>navigator.serviceWorker.ready);
            await page.reload({waitUntil:'networkidle',timeout:60000});
            async function verify(mode){
              await page.evaluate(m=>localStorage.setItem('ari-theme',m),mode);
              await page.goto(process.env.BASE+'/ari/trading/',{waitUntil:'networkidle',timeout:60000});
              await page.click('[data-go="live"]');
              await page.waitForSelector('#tv iframe',{state:'attached',timeout:30000});
              await page.waitForTimeout(3500);
              const s=await page.evaluate(()=>{const f=document.querySelector('#tv iframe'),r=document.querySelector('#tv')?.getBoundingClientRect();return{theme:document.documentElement.dataset.theme,key:localStorage.getItem('ari-theme'),iframe:!!f,w:r?.width||0,h:r?.height||0,filter:f?getComputedStyle(f).filter:'none',src:f?.src||''}});
              console.log(mode.toUpperCase(),JSON.stringify(s));
              assert.equal(s.theme,mode);assert.equal(s.key,mode);assert.equal(s.iframe,true);assert.ok(s.w>250&&s.h>300);assert.ok(s.src.includes('tradingview-widget.com'));
              if(mode==='sepia')assert.equal(s.filter,'none');else assert.notEqual(s.filter,'none');
              await page.screenshot({path:`hof409-${mode}.png`,fullPage:true});
            }
            for(const m of ['dark','sepia','red-night'])await verify(m);
            console.log('PASS LIVE CHART 3 THEMES');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hof409-chart-3-themes
          path: hof409-*.png
          if-no-files-found: warn