name: HOF-409 Theme QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hof409-theme-qa.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Diagnose Trading LIVE chart
        env:
          BASE: https://corp.kortex10x.com
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:1280,height:900}});
            const page=await ctx.newPage();
            const failed=[];
            const responses=[];
            page.on('requestfailed',r=>{if(/tradingview|s3\.tradingview/i.test(r.url()))failed.push({url:r.url(),error:r.failure()?.errorText})});
            page.on('response',r=>{if(/tradingview|s3\.tradingview/i.test(r.url()))responses.push({status:r.status(),url:r.url()})});
            page.on('console',m=>{if(/tradingview|refused|blocked|error/i.test(m.text()))console.log('BROWSER_CONSOLE',m.type(),m.text())});
            await page.goto(process.env.BASE+'/ari/',{waitUntil:'networkidle',timeout:60000});
            await page.evaluate(()=>navigator.serviceWorker.ready);
            await page.reload({waitUntil:'networkidle',timeout:60000});
            await page.evaluate(()=>localStorage.setItem('ari-theme','sepia'));
            await page.evaluate(()=>sessionStorage.setItem('ari-trading-screen','live'));
            await page.goto(process.env.BASE+'/ari/trading/?resume=1',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(8000);
            const state=await page.evaluate(()=>{
              const tv=document.querySelector('#tv');
              const r=tv?.getBoundingClientRect();
              const scripts=[...(tv?.querySelectorAll('script')||[])].map(s=>({src:s.src,type:s.type,text:(s.textContent||'').slice(0,180)}));
              return {
                theme:document.documentElement.dataset.theme,
                key:localStorage.getItem('ari-theme'),
                tvExists:!!tv,
                rect:r?{w:r.width,h:r.height}:null,
                iframeCount:tv?.querySelectorAll('iframe').length||0,
                canvasCount:tv?.querySelectorAll('canvas').length||0,
                widgetContainers:tv?.querySelectorAll('.tradingview-widget-container__widget').length||0,
                scripts,
                html:(tv?.innerHTML||'').slice(0,1800)
              };
            });
            console.log('STATE',JSON.stringify(state,null,2));
            console.log('TRADINGVIEW_RESPONSES',JSON.stringify(responses,null,2));
            console.log('TRADINGVIEW_FAILED',JSON.stringify(failed,null,2));
            console.log('FRAME_URLS',JSON.stringify(page.frames().map(f=>f.url()),null,2));
            await page.screenshot({path:'hof409-live.png',fullPage:true});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hof409-live-chart-diagnostic
          path: hof409-live.png
          if-no-files-found: warn