name: HOF-409 Theme QA
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hof409-theme-qa.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify real LIVE navigation and chart
        env:
          BASE: https://corp.kortex10x.com
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const assert = require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:1280,height:900}});
            const page=await ctx.newPage();
            await page.addInitScript(()=>{
              window.__ariScriptAppends=[];
              const orig=Element.prototype.appendChild;
              Element.prototype.appendChild=function(node){
                if(node&&node.tagName==='SCRIPT')window.__ariScriptAppends.push({src:node.src||'',parent:this.id||this.className||this.tagName});
                return orig.call(this,node);
              };
            });
            const requests=[],responses=[],failed=[];
            page.on('request',r=>{if(/tradingview/i.test(r.url()))requests.push(r.url())});
            page.on('response',r=>{if(/tradingview/i.test(r.url()))responses.push({status:r.status(),url:r.url()})});
            page.on('requestfailed',r=>{if(/tradingview/i.test(r.url()))failed.push({url:r.url(),error:r.failure()?.errorText})});
            await page.goto(process.env.BASE+'/ari/',{waitUntil:'networkidle',timeout:60000});
            await page.evaluate(()=>navigator.serviceWorker.ready);
            await page.reload({waitUntil:'networkidle',timeout:60000});
            await page.evaluate(()=>localStorage.setItem('ari-theme','sepia'));
            await page.goto(process.env.BASE+'/ari/trading/',{waitUntil:'networkidle',timeout:60000});
            await page.waitForTimeout(300);
            assert.equal(await page.locator('[data-go="live"]').isVisible(),true,'LIVE button not visible');
            await page.click('[data-go="live"]');
            await page.waitForTimeout(9000);
            const state=await page.evaluate(()=>{
              const tv=document.querySelector('#tv'),r=tv?.getBoundingClientRect(),f=tv?.querySelector('iframe'),c=tv?.querySelector('canvas');
              return {theme:document.documentElement.dataset.theme,key:localStorage.getItem('ari-theme'),liveActive:document.querySelector('#live')?.classList.contains('active'),rect:r?{w:r.width,h:r.height}:null,iframe:!!f,canvas:!!c,iframeSrc:f?.src||'',filter:f?getComputedStyle(f).filter:(c?getComputedStyle(c).filter:'none'),appends:window.__ariScriptAppends,html:(tv?.innerHTML||'').slice(0,1200)};
            });
            console.log('STATE',JSON.stringify(state,null,2));
            console.log('REQUESTS',JSON.stringify(requests,null,2));
            console.log('RESPONSES',JSON.stringify(responses,null,2));
            console.log('FAILED',JSON.stringify(failed,null,2));
            console.log('FRAMES',JSON.stringify(page.frames().map(f=>f.url()),null,2));
            await page.screenshot({path:'hof409-live-real.png',fullPage:true});
            assert.equal(state.theme,'sepia');assert.equal(state.key,'sepia');assert.equal(state.liveActive,true);assert.ok(state.rect.w>250&&state.rect.h>300);assert.ok(state.iframe||state.canvas,'real LIVE chart surface missing');
            console.log('PASS REAL LIVE CHART SEPIA');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hof409-live-real
          path: hof409-live-real.png
          if-no-files-found: warn