name: HOF417 detect existing deploy secrets
on:
  push:
    branches: [hof417-alt-route]
permissions:
  contents: read
jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
      HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      HETZNER_PASSWORD: ${{ secrets.HETZNER_PASSWORD }}
      HETZNER_IP: ${{ secrets.HETZNER_IP }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      SERVER_IP: ${{ secrets.SERVER_IP }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          for n in HETZNER_HOST HETZNER_SSH_KEY HETZNER_PASSWORD HETZNER_IP SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KEY SSH_PASSWORD SERVER_IP VPS_HOST VPS_PASSWORD DEPLOY_HOST DEPLOY_KEY; do
            if [ -n "${!n:-}" ]; then echo "$n=PRESENT"; else echo "$n=ABSENT"; fi
          done
