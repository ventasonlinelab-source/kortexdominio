name: HOF409 visual shell PWA QA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  visual-pwa-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Wait for exact production bytes
        run: |
          ok=0
          for i in $(seq 1 90); do
            sw=$(curl -fsSL 'https://corp.kortex10x.com/ari/sw.js?qa=59' || true)
            dash=$(curl -fsSL 'https://corp.kortex10x.com/ari/dashboards.js?qa=59' || true)
            runtime=$(curl -fsSL 'https://corp.kortex10x.com/ari/trading/ari-chart-runtime-fix-v1.js?v=2&qa=59' || true)
            mobility=$(curl -fsSL 'https://corp.kortex10x.com/ari/trading/ari-chart-mobility-v3.js?v=2&qa=59' || true)
            live=$(curl -fsSL 'https://corp.kortex10x.com/ari/trading/live.html?qa=59' || true)
            if grep -q "ari-v59" <<<"$sw" && grep -q -- "--panel:#101010" <<<"$dash" && grep -q 'filter:none!important' <<<"$runtime" && grep -q 'background:#242424!important' <<<"$mobility" && grep -q 'ari-chart-runtime-fix-v1.js?v=2' <<<"$live" && grep -q 'ari-chart-mobility-v3.js?v=2' <<<"$live"; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
      - name: Render exact PWA route and inspect pixels
        run: |
          mkdir -p "$RUNNER_TEMP/hof409visual" && cd "$RUNNER_TEMP/hof409visual"
          npm init -y >/dev/null 2>&1
          npm install puppeteer@24.16.0 sharp@0.34.3 --no-audit --no-fund >/dev/null 2>&1
          cat > qa.mjs <<'JS'
          import puppeteer from 'puppeteer';import sharp from 'sharp';import fs from 'node:fs';
          const A=(v,m)=>{if(!v)throw new Error(m)},sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const base='https://corp.kortex10x.com',out=process.env.GITHUB_WORKSPACE+'/hof409-visual';fs.mkdirSync(out,{recursive:true});
          const browser=await puppeteer.launch({headless:true,args:['--no-sandbox']});const page=await browser.newPage();await page.setViewport({width:1280,height:900,deviceScaleFactor:1});
          const errors=[];page.on('pageerror',e=>errors.push(String(e)));
          // Exact installed-PWA start_url from manifest.
          await page.goto(base+'/ari/?source=pwa',{waitUntil:'networkidle2',timeout:60000});
          await page.evaluate(()=>localStorage.setItem('ari-theme','dark'));
          await page.evaluate(async()=>{if('serviceWorker'in navigator){let r=await navigator.serviceWorker.ready;await r.update();await new Promise(res=>setTimeout(res,800));const reg=await navigator.serviceWorker.getRegistration('/ari/');if(reg?.waiting){reg.waiting.postMessage?.({type:'SKIP_WAITING'});await new Promise(res=>setTimeout(res,300))}}});
          await page.reload({waitUntil:'networkidle2',timeout:60000});await page.waitForFunction(()=>navigator.serviceWorker.controller&&document.documentElement.dataset.theme==='dark',{timeout:30000});await sleep(500);
          A(await page.evaluate(()=>location.pathname==='/ari/'&&new URL(location.href).searchParams.get('source')==='pwa'),'not PWA start_url');
          const cache=await page.evaluate(async()=>('caches'in window)?await caches.keys():[]);A(cache.includes('ari-v59'),'PWA cache is not v59: '+cache.join(','));
          await page.screenshot({path:out+'/01-pwa-home-dark.png',fullPage:true});
          // Physical user route: Menú → TRADING → LIVE.
          const menuClicked=await page.evaluate(()=>{const b=[...document.querySelectorAll('.nav')].find(x=>x.textContent.trim().includes('Menú'));if(!b)return false;b.click();return true});A(menuClicked,'Menú nav missing');await sleep(300);
          await page.waitForSelector('[data-dashboard-route="/ari/trading/"]',{timeout:15000});await page.click('[data-dashboard-route="/ari/trading/"]');await page.waitForFunction(()=>location.pathname==='/ari/trading/',{timeout:30000});await sleep(700);
          A(await page.evaluate(()=>document.documentElement.dataset.theme==='dark'),'theme lost entering trading');await page.screenshot({path:out+'/02-trading-home-dark.png',fullPage:true});
          await page.click('[data-go="live"]');await page.waitForFunction(()=>location.pathname==='/ari/trading/live.html'&&window.__ariEngine?.candles?.length>20&&window.ARI_CHART_API?.version==='1.2.0',{timeout:60000});await sleep(1000);
          A(await page.evaluate(()=>document.documentElement.dataset.theme==='dark'),'theme lost in live');A(await page.evaluate(()=>!!navigator.serviceWorker.controller),'PWA control lost');
          const liveRuntime=await page.evaluate(()=>({runtime:getComputedStyle(document.querySelector('#ariChartCanvas')).filter,activeTf:getComputedStyle(document.querySelector('.ari-tf.active')).backgroundColor,activeTool:getComputedStyle(document.querySelector('.ari-tool.active')).backgroundColor,canvas:document.querySelector('#ariChartCanvas').getBoundingClientRect().toJSON()}));
          A(liveRuntime.runtime==='none','legacy canvas filter still active: '+liveRuntime.runtime);A(liveRuntime.activeTf==='rgb(36, 36, 36)','active TF not graphite: '+liveRuntime.activeTf);A(liveRuntime.activeTool==='rgb(36, 36, 36)','active tool not graphite: '+liveRuntime.activeTool);
          await page.screenshot({path:out+'/03-live-dark.png',fullPage:true});
          // Rendered-pixel analysis. Generic brown antialias is allowed only in tiny disconnected fragments (gold accent edges), never as a filled surface.
          async function visualStats(file){const {data,info}=await sharp(file).removeAlpha().raw().toBuffer({resolveWithObject:true});const total=info.width*info.height,mask=new Uint8Array(total),seen=new Uint8Array(total);let brown=0;for(let p=0,i=0;p<total;p++,i+=3){const r=data[i],g=data[i+1],b=data[i+2],lum=.2126*r+.7152*g+.0722*b;if(lum<105&&r>=g+4&&g>=b+4&&(r-b)>=10){mask[p]=1;brown++}}let maxComponent=0,components=0;const stack=[];for(let p=0;p<total;p++){if(!mask[p]||seen[p])continue;components++;seen[p]=1;stack.push(p);let n=0;while(stack.length){const q=stack.pop();n++;const x=q%info.width,y=(q-x)/info.width;for(const z of [q-1,q+1,q-info.width,q+info.width]){if(z<0||z>=total||seen[z]||!mask[z])continue;const zx=z%info.width,zy=(z-zx)/info.width;if(Math.abs(zx-x)+Math.abs(zy-y)!==1)continue;seen[z]=1;stack.push(z)}}if(n>maxComponent)maxComponent=n}return{width:info.width,height:info.height,brownPct:+(brown/total*100).toFixed(4),maxBrownComponent:maxComponent,brownComponents:components}}
          const shots={};for(const f of ['01-pwa-home-dark.png','02-trading-home-dark.png','03-live-dark.png'])shots[f]=await visualStats(out+'/'+f);
          for(const [f,s] of Object.entries(shots))A(s.maxBrownComponent<180,`rendered brown surface in ${f}: component ${s.maxBrownComponent}px`);
          // The chart itself must render dark, not merely report a dark CSS variable.
          const livePng=sharp(out+'/03-live-dark.png');const meta=await livePng.metadata(),r=liveRuntime.canvas;const crop={left:Math.max(0,Math.floor(r.x+70)),top:Math.max(0,Math.floor(r.y+90)),width:Math.max(20,Math.min(meta.width-Math.floor(r.x+70),Math.floor(r.width-160))),height:Math.max(20,Math.min(meta.height-Math.floor(r.y+90),Math.floor(r.height-180)))};const stats=await livePng.extract(crop).stats();const chartMean=(stats.channels[0].mean+stats.channels[1].mean+stats.channels[2].mean)/3;A(chartMean<65,'chart rendered light, mean='+chartMean.toFixed(2));
          await page.setViewport({width:390,height:844,deviceScaleFactor:1});await sleep(600);await page.screenshot({path:out+'/04-live-mobile-dark.png',fullPage:true});shots['04-live-mobile-dark.png']=await visualStats(out+'/04-live-mobile-dark.png');A(shots['04-live-mobile-dark.png'].maxBrownComponent<180,'mobile rendered brown surface');
          const state=await page.evaluate(()=>({path:location.pathname,theme:document.documentElement.dataset.theme,sw:!!navigator.serviceWorker.controller,api:ARI_CHART_API?.version,feed:ARI_CHART_API?.getFeedState(),modes:document.querySelectorAll('[data-doc-mode]').length,iframe:document.querySelectorAll('iframe').length,body:document.body.scrollWidth,inner:innerWidth}));
          A(state.path==='/ari/trading/live.html'&&state.theme==='dark'&&state.sw&&state.feed?.source?.includes('BIQUOTE')&&state.modes===3&&state.iframe===0,'live regression '+JSON.stringify(state));A(state.body<=state.inner+1,'mobile overflow');A(errors.length===0,'page errors '+errors.join('|'));
          const result={ok:true,route:['/ari/?source=pwa','Menú click','TRADING dashboard click','LIVE click','/ari/trading/live.html'],cache,liveRuntime,chartMean,shots,state,errors};fs.writeFileSync(out+'/qa.json',JSON.stringify(result,null,2));console.log(JSON.stringify(result,null,2));await browser.close();
          JS
          node qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hof409-visual-shell-pwa
          path: hof409-visual/
          if-no-files-found: error
