<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>A.R.I. · Trading</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050505;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#ariBase{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050505}
</style>
</head>
<body>
<iframe id="ariBase" src="/ari/trading/index.html?embedded=1" title="A.R.I. Trading"></iframe>
<script>
(()=>{
  const frame=document.getElementById('ariBase');
  let timer=0;
  function ensureEngineRouter(){
    const doc=frame.contentDocument;if(!doc)return;
    if(doc.defaultView?.ARI_TRADING_ENGINE_ROUTER||doc.getElementById('hof409-live-engine-router-loader'))return;
    const r=doc.createElement('script');r.id='hof409-live-engine-router-loader';r.src='/ari/trading/live-engine-router-v1.js?v=2';doc.body.appendChild(r);
  }
  function ensureCanonicalCapture(){
    const doc=frame.contentDocument;
    if(!doc)return;
    const side=doc.querySelector('#live .side');
    if(!side)return;
    if(doc.defaultView?.ARI_HOF409_CAPTURE_TF)return;
    if(doc.getElementById('hof409-tf-capture-loader'))return;
    const s=doc.createElement('script');
    s.id='hof409-tf-capture-loader';
    s.src='/ari/trading/live-panel-v3.js?v=1';
    s.onload=()=>{
      if(timer){clearInterval(timer);timer=0;}
      if(!doc.getElementById('hof409-tf-notion-persist-loader')){
        const p=doc.createElement('script');
        p.id='hof409-tf-notion-persist-loader';
        p.src='/ari/trading/tf-notion-persist-v1.js?v=1';
        doc.body.appendChild(p);
      }
      if(!doc.getElementById('hof409-mobile-followup-loader')){
        const m=doc.createElement('script');
        m.id='hof409-mobile-followup-loader';
        m.src='/ari/trading/mobile-followup-v1.js?v=1';
        doc.body.appendChild(m);
      }
    };
    doc.body.appendChild(s);
  }
  frame.addEventListener('load',()=>{
    setTimeout(()=>{ensureEngineRouter();ensureCanonicalCapture();},100);
    timer=setInterval(()=>{ensureEngineRouter();ensureCanonicalCapture();},800);
    setTimeout(()=>{if(timer){clearInterval(timer);timer=0;}},12000);
  });
})();
</script>
</body>
</html>
