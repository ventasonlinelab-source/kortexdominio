<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" id="themeColor" content="#050505"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="A.R.I."/>
<link rel="manifest" href="/ari/manifest.webmanifest"/>
<link rel="icon" href="/ari/icon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="/ari/icon.svg"/>
<title>A.R.I.</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;--bg:#050505;--panel:#0c0a07;--panel2:#100c08;--line:#2d2519;--gold:#d8a84b;--text:#f4efe4;--muted:#9d927f;--muted2:#a99d86;--border:#2b241a;--header:rgba(5,5,5,.94);--bottom:rgba(5,5,5,.97);--blue:#5484ed;--lightblue:#a4bdfc}
html[data-theme="light"]{color-scheme:light;--bg:#f5f1e8;--panel:#fffdf8;--panel2:#f3ecdf;--line:#d7c9b0;--gold:#9a6a1d;--text:#211b13;--muted:#746956;--muted2:#665b48;--border:#d8ccb9;--header:rgba(245,241,232,.94);--bottom:rgba(245,241,232,.97);--blue:#416fc8;--lightblue:#7598d8}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}.app{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;padding:4px 2px 14px;position:sticky;top:0;background:var(--header);backdrop-filter:blur(12px);z-index:5}.brand-wrap{display:flex;align-items:center;gap:11px}.logo{width:40px;height:40px;border-radius:12px}.brand{font-size:23px;letter-spacing:.16em;font-weight:700}.sub{font-size:10px;color:var(--muted);margin-top:3px}
.view{display:none}.view.active{display:block}.panel{border:1px solid var(--border);background:var(--panel);border-radius:18px;padding:16px;margin-bottom:14px}.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}.panel h1,.panel h2{margin:7px 0 6px}.meta{font-size:12px;color:var(--muted2);line-height:1.5}.section-title{font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:.12em;margin:14px 0 10px}
.capture{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--border);background:var(--panel);border-radius:18px;padding:10px}.capture textarea{flex:1;resize:none;min-height:48px;max-height:150px;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:14px;line-height:1.4;padding:8px}.capture textarea::placeholder{color:var(--muted)}.round{width:44px;height:44px;flex:0 0 44px;border-radius:50%;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:18px}.round.listening{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 18%,transparent)}.send{border:1px solid var(--gold);background:color-mix(in srgb,var(--gold) 18%,var(--panel));color:var(--text);border-radius:13px;padding:12px 14px;font-weight:700}.capture-note,.queue-status{font-size:10px;color:var(--muted);margin:7px 4px 0}.queue-status{color:var(--gold)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:2px 0 16px}.day{appearance:none;border:1px solid var(--border);background:var(--panel);border-radius:12px;padding:9px 4px;text-align:center;color:var(--muted)}.day.active{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 13%,var(--panel));color:var(--text)}.day b{display:block;font-size:11px}.day span{font-size:10px}
.timeline{position:relative;padding-left:64px}.timeline:before{content:"";position:absolute;left:52px;top:8px;bottom:8px;width:1px;background:var(--line)}.event{position:relative;border:1px solid var(--border);background:var(--panel);border-radius:13px;padding:11px 12px;margin-bottom:10px}.event:before{content:"";position:absolute;left:-17px;top:16px;width:9px;height:9px;border:2px solid var(--gold);background:var(--bg);border-radius:50%}.event.g9{border-left:4px solid var(--blue)}.event.g1{border-left:4px solid var(--lightblue)}.event.active{box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 35%,transparent);background:color-mix(in srgb,var(--gold) 10%,var(--panel))}.event.done{opacity:.7}.time{position:absolute;left:-64px;top:14px;width:44px;text-align:right;font-size:11px;color:var(--muted)}.event-title{font-size:13px;font-weight:680}.event-meta{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.4}
.theme-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.theme-option{appearance:none;border:1px solid var(--border);background:var(--panel2);color:var(--muted);border-radius:12px;padding:11px 6px;font-size:11px;font-weight:700}.theme-option.active{border-color:var(--gold);color:var(--text)}
.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);padding:9px 18px calc(9px + env(safe-area-inset-bottom));background:var(--bottom);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:10}.nav{appearance:none;border:0;background:none;text-align:center;color:var(--muted);font-size:10px;padding:4px}.nav.active{color:var(--gold)}.nav b{display:block;font-size:17px;line-height:1.1;margin-bottom:2px}
</style>
</head>
<body>
<main class="app">
<header><div class="brand-wrap"><img class="logo" src="/ari/icon.svg" alt="A.R.I."/><div><div class="brand">A.R.I.</div><div class="sub">Universo personal</div></div></div></header>

<section class="view active" data-view="ahora">
<section class="panel"><div class="eyebrow">Ahora</div><h1 id="nowTitle">Cargando…</h1><div class="meta" id="nowMeta"></div></section>
<div class="capture"><button class="round" id="micBtn" aria-label="Hablar">🎙️</button><textarea id="noteInput" rows="1" placeholder="Habla o escribe una anotación…"></textarea><button class="send" id="sendNote">Enviar</button></div>
<div class="capture-note">Se asocia automáticamente al bloque activo y al día actual.</div>
<div class="queue-status" id="queueStatus"></div>
</section>

<section class="view" data-view="linea">
<section class="days" id="days"></section>
<div class="section-title" id="lineTitle">Línea temporal</div>
<section class="timeline" id="timeline"></section>
</section>

<section class="view" data-view="memoria">
<div class="section-title">Memoria</div>
<section class="panel"><div class="eyebrow">Notion</div><h2>Memoria del día</h2><div class="meta">Aquí aparecerán las anotaciones y resultados vinculados a cada bloque cuando cerremos la escritura automática a Notion.</div></section>
</section>

<section class="view" data-view="mas">
<div class="section-title">Apariencia</div>
<section class="panel"><div class="theme-row"><button class="theme-option" data-theme-choice="dark">🌙 Oscuro</button><button class="theme-option" data-theme-choice="light">☀️ Claro</button><button class="theme-option" data-theme-choice="auto">◐ Auto</button></div></section>
</section>
</main>

<nav class="bottom"><button class="nav active" data-target="ahora"><b>⌂</b>Ahora</button><button class="nav" data-target="linea"><b>│</b>Línea</button><button class="nav" data-target="memoria"><b>◎</b>Memoria</button><button class="nav" data-target="mas"><b>⋯</b>Más</button></nav>

<script>
const THEME_KEY='ari-theme',QUEUE_KEY='ari-note-queue',mediaDark=matchMedia('(prefers-color-scheme: dark)');
function storedTheme(){return localStorage.getItem(THEME_KEY)||'auto'}
function applyTheme(choice=storedTheme()){const r=choice==='auto'?(mediaDark.matches?'dark':'light'):choice;document.documentElement.dataset.theme=r;document.getElementById('themeColor').content=r==='dark'?'#050505':'#f5f1e8';document.querySelectorAll('.theme-option').forEach(b=>b.classList.toggle('active',b.dataset.themeChoice===choice))}
function setTheme(c){localStorage.setItem(THEME_KEY,c);applyTheme(c)}
mediaDark.addEventListener?.('change',()=>{if(storedTheme()==='auto')applyTheme('auto')});applyTheme();
document.querySelectorAll('.theme-option').forEach(b=>b.onclick=()=>setTheme(b.dataset.themeChoice));

let calendarData=null,selectedDate='2026-09-07';
const pad=n=>String(n).padStart(2,'0'),toMin=t=>{const[a,b]=t.split(':').map(Number);return a*60+b};
function nowMadrid(){return new Date(new Date().toLocaleString('en-US',{timeZone:'Europe/Madrid'}))}
function todayMadrid(){const n=nowMadrid();return `${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`}
function eventState(e,date){const n=nowMadrid(),today=todayMadrid();if(date<today)return'done';if(date>today)return'future';let x=n.getHours()*60+n.getMinutes(),s=toMin(e.start),en=toMin(e.end);if(en<=s)en+=1440;if(x<s&&en>1440)x+=1440;return x>=en?'done':x>=s?'active':'future'}
function currentEvents(){return calendarData?.days?.[selectedDate]||[]}
function activeEvent(){const date=todayMadrid(),list=calendarData?.days?.[date]||[];return list.find(e=>eventState(e,date)==='active')||null}
function renderDays(){const root=document.getElementById('days');root.innerHTML='';Object.keys(calendarData.days).forEach(date=>{const d=new Date(date+'T12:00:00'),el=document.createElement('button');el.className='day'+(date===selectedDate?' active':'');el.innerHTML=`<b>${new Intl.DateTimeFormat('es-ES',{weekday:'short'}).format(d)}</b><span>${d.getDate()}</span>`;el.onclick=()=>{selectedDate=date;renderAll()};root.appendChild(el)})}
function renderNow(){const e=activeEvent();nowTitle.textContent=e?e.title:'Sin bloque activo';nowMeta.textContent=e?`${e.start}–${e.end}`:`${todayMadrid()} · sin bloque activo`}
function renderTimeline(){timeline.innerHTML='';lineTitle.textContent=`Línea temporal · ${selectedDate}`;currentEvents().forEach(e=>{const st=eventState(e,selectedDate);timeline.insertAdjacentHTML('beforeend',`<article class="event g${e.color_id} ${st}"><div class="time">${e.start}</div><div class="event-title">${e.title}</div><div class="event-meta">${e.start}–${e.end}<br>${e.description||''}</div></article>`)})}
function renderAll(){renderDays();renderNow();renderTimeline()}
function go(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.dataset.view===v));document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.target===v));history.replaceState(null,'','#'+v);scrollTo({top:0,behavior:'instant'})}
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>go(n.dataset.target));
async function loadCalendar(){try{const r=await fetch('/ari/calendar.json?ts='+Date.now(),{cache:'no-store'});calendarData=await r.json();const today=todayMadrid();if(calendarData.days[today])selectedDate=today;renderAll()}catch(e){nowTitle.textContent='Error cargando calendario';nowMeta.textContent='No se pudo leer la línea temporal.'}}

async function registration(){if(!('serviceWorker'in navigator))throw Error('Service Worker no disponible');return navigator.serviceWorker.ready}
async function notify(title,body,tag='ari-note'){try{if(!('Notification'in window)||Notification.permission!=='granted')return false;const r=await registration();await r.showNotification(title,{body,icon:'/ari/icon.svg',badge:'/ari/icon.svg',tag,data:{url:'/ari/#ahora'}});return true}catch(e){return false}}
function queue(){try{return JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]')}catch(e){return[]}}
function saveQueue(items){localStorage.setItem(QUEUE_KEY,JSON.stringify(items));queueStatus.textContent=items.length?`${items.length} anotación${items.length===1?'':'es'} pendiente${items.length===1?'':'s'} de sincronizar.`:''}
function initQueue(){saveQueue(queue())}
async function sendCapture(){const text=noteInput.value.trim(),evt=activeEvent(),date=todayMadrid();if(!text){queueStatus.textContent='No hay texto para enviar.';await notify('A.R.I. · error','No se envió nada porque la anotación está vacía.','ari-note-error');return}
try{const items=queue();items.push({id:crypto.randomUUID?.()||String(Date.now()),created_at:new Date().toISOString(),date,block:evt?.title||'SIN BLOQUE',calendar_start:evt?.start||null,calendar_end:evt?.end||null,text,status:'queued'});saveQueue(items);noteInput.value='';await notify('A.R.I. · guardada en cola',`${evt?.title||'SIN BLOQUE'} · anotación pendiente de sincronizar con Notion.`,'ari-note-queued')}
catch(e){queueStatus.textContent='Error guardando la anotación.';await notify('A.R.I. · error','La anotación no pudo guardarse.','ari-note-error')}}
sendNote.onclick=sendCapture;noteInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendCapture()}});

const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SpeechRecognition){const recog=new SpeechRecognition();recog.lang='es-ES';recog.interimResults=false;recog.continuous=false;micBtn.onclick=()=>{try{micBtn.classList.add('listening');recog.start()}catch(e){}};recog.onresult=e=>{const t=e.results?.[0]?.[0]?.transcript||'';noteInput.value=(noteInput.value?noteInput.value+' ':'')+t;micBtn.classList.remove('listening');noteInput.focus()};recog.onerror=async()=>{micBtn.classList.remove('listening');queueStatus.textContent='No pude escuchar el audio.';await notify('A.R.I. · error de audio','No se pudo convertir el audio en texto.','ari-audio-error')};recog.onend=()=>micBtn.classList.remove('listening')}
else{micBtn.onclick=async()=>{queueStatus.textContent='Dictado no disponible en este navegador.';await notify('A.R.I. · audio no disponible','Este iPhone no expone dictado web en esta sesión.','ari-audio-unavailable')}}

if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/ari/sw.js').catch(()=>{}));
initQueue();go(location.hash.slice(1)||'ahora');loadCalendar();
</script>
</body>
</html>
