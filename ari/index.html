<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;--bg:#050505;--panel:#0c0a07;--panel2:#100c08;--line:#2d2519;--gold:#d8a84b;--text:#f4efe4;--muted:#9d927f;--muted2:#a99d86;--border:#2b241a;--header:rgba(5,5,5,.94);--bottom:rgba(5,5,5,.97);--phase-a:#161616;--phase-b:#252525;--phase-border:#353535;--task-bg:#5b4622;--task-border:#806632;--task-accent:#c9a45b;--danger:#c46b62}

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh}.app{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;padding:4px 2px 14px;position:sticky;top:0;background:var(--header);backdrop-filter:blur(12px);z-index:5}.brand-wrap{display:flex;align-items:center;gap:11px}.logo{width:40px;height:40px;border-radius:12px}.brand{font-size:23px;letter-spacing:.16em;font-weight:700}.sub{font-size:10px;color:var(--muted);margin-top:3px}
.view{display:none}.view.active{display:block}.panel{border:1px solid var(--border);background:var(--panel);border-radius:18px;padding:16px;margin-bottom:14px}.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}.panel h1,.panel h2{margin:7px 0 6px}.meta{font-size:12px;color:var(--muted2);line-height:1.5}.section-title{font-size:11px;color:var(--muted2);text-transform:uppercase;letter-spacing:.12em;margin:14px 0 10px}
.capture{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--border);background:var(--panel);border-radius:18px;padding:10px}.capture textarea{flex:1;resize:none;min-height:48px;max-height:150px;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:14px;line-height:1.4;padding:8px}.capture textarea::placeholder{color:var(--muted)}.round{width:44px;height:44px;flex:0 0 44px;border-radius:50%;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:18px}.round.recording{border-color:var(--danger);box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 20%,transparent);animation:pulse 1.2s infinite}.send{border:1px solid var(--gold);background:color-mix(in srgb,var(--gold) 18%,var(--panel));color:var(--text);border-radius:13px;padding:12px 14px;font-weight:700}.queue-status{font-size:10px;color:var(--gold);margin:7px 4px 0}.audio-status{font-size:10px;color:var(--muted);margin:5px 4px 0}@keyframes pulse{50%{transform:scale(.94)}}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:2px 0 16px}.day{appearance:none;border:1px solid var(--border);background:var(--panel);border-radius:12px;padding:9px 4px;text-align:center;color:var(--muted)}.day.active{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 13%,var(--panel));color:var(--text)}.day b{display:block;font-size:11px}.day span{font-size:10px}
.timeline{position:relative;padding-left:64px}.timeline:before{content:"";position:absolute;left:52px;top:8px;bottom:8px;width:1px;background:var(--line)}.event{position:relative;border-radius:13px;margin-bottom:10px}.event:before{content:"";position:absolute;left:-17px;top:16px;width:9px;height:9px;border:2px solid var(--gold);background:var(--bg);border-radius:50%}.event.block{border:1px solid var(--phase-border);overflow:hidden}.event.block.phase-a{background:var(--phase-a)}.event.block.phase-b{background:var(--phase-b)}.block-head{padding:11px 12px}.event.active{box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 45%,transparent)}.event.done{opacity:.62}.time{position:absolute;left:-64px;top:14px;width:44px;text-align:right;font-size:11px;color:var(--muted)}.event-title{font-size:13px;font-weight:680}.event-kind{font-size:9px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:5px;color:var(--muted2)}.event-meta{font-size:11px;color:var(--muted);margin-top:5px}.task-list{border-top:1px solid var(--phase-border);padding:0 12px}.task-row{position:relative;display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;padding:10px 0;border-top:1px solid color-mix(in srgb,var(--task-border) 65%,transparent)}.task-row:first-child{border-top:0}.task-time{font-size:10px;color:var(--task-accent);font-variant-numeric:tabular-nums}.task-copy{min-width:0}.task-label{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--task-accent);margin-bottom:2px}.task-title{font-size:12px;font-weight:700;line-height:1.3}.task-row.active{background:color-mix(in srgb,var(--task-bg) 18%,transparent);margin:0 -12px;padding-left:12px;padding-right:12px}.task-row.done{opacity:.55}.task-row.done:after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--task-accent);opacity:.8}.standalone-task{margin-left:12px;padding:10px 12px;border:1px solid var(--task-border);background:color-mix(in srgb,var(--task-bg) 70%,var(--panel));box-shadow:inset 3px 0 0 var(--task-accent)}.standalone-task:before{left:-29px;border-color:var(--task-accent)}
.workspace{border:1px solid var(--border);background:var(--panel);border-radius:18px;margin-bottom:12px;overflow:hidden}.workspace-head{padding:14px 15px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.workspace-title{font-size:16px;font-weight:750;margin-top:4px}.workspace-pill{font-size:9px;color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 45%,var(--border));border-radius:999px;padding:5px 8px;white-space:nowrap}.workspace-body{padding:14px 15px}.workspace-empty{border:1px dashed var(--border);border-radius:14px;padding:15px;text-align:center}.workspace-empty strong{display:block;font-size:13px;margin-bottom:5px}.workspace-empty span{font-size:11px;color:var(--muted);line-height:1.45}.workspace-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.workspace-btn{appearance:none;border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:12px;padding:11px 10px;font-size:11px;font-weight:700}.workspace-btn[disabled]{opacity:.42}.complete-btn{width:100%;appearance:none;border:1px solid var(--gold);background:color-mix(in srgb,var(--gold) 14%,var(--panel));color:var(--text);border-radius:14px;padding:12px;margin:10px 0 12px;font-weight:800}.complete-btn[disabled]{opacity:.45}.now-capture.hidden{display:none}
.menu-list{display:grid;gap:10px}.menu-item{width:100%;appearance:none;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:16px;padding:15px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:12px}.menu-item:active{transform:scale(.99)}.menu-main{display:flex;align-items:center;gap:12px}.menu-icon{font-size:21px;width:28px;text-align:center}.menu-copy strong{display:block;font-size:14px}.menu-copy span{display:block;font-size:11px;color:var(--muted);margin-top:3px}.chev{color:var(--muted);font-size:18px}.back{appearance:none;border:0;background:none;color:var(--gold);font-size:13px;padding:4px 0 12px}.theme-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.theme-option{appearance:none;border:1px solid var(--border);background:var(--panel2);color:var(--muted);border-radius:12px;padding:11px 6px;font-size:11px;font-weight:700}.theme-option.active{border-color:var(--gold);color:var(--text)}.update-status{font-size:11px;color:var(--muted);margin-top:10px}
.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);padding:9px 28px calc(9px + env(safe-area-inset-bottom));background:var(--bottom);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);z-index:10}.bottom.has-context{grid-template-columns:repeat(4,1fr)}.nav{appearance:none;border:0;background:none;text-align:center;color:var(--muted);font-size:10px;padding:4px}.nav.active{color:var(--gold)}.nav b{display:block;font-size:17px;line-height:1.1;margin-bottom:2px}
</style>
</head>
<body>
<main class="app">
<header><div class="brand-wrap"><img class="logo" src="/ari/icon.svg" alt="A.R.I."/><div><div class="brand">A.R.I.</div><div class="sub">Universo personal</div></div></div></header>
<section class="view active" data-view="ahora">
<section class="panel"><div class="eyebrow">Ahora</div><h1 id="nowTitle">Cargando…</h1><div class="meta" id="nowMeta"></div></section>
<section id="contextWorkspace"></section>
<button class="complete-btn" id="completeTask" hidden>✓ Marcar tarea como hecha</button>
<div class="now-capture" id="nowCapture"><div class="capture"><button class="round" id="micBtn" aria-label="Grabar audio">🎙️</button><textarea id="noteInput" rows="1" placeholder="Habla o escribe…"></textarea><button class="send" id="sendNote">Enviar</button></div>
<div class="audio-status" id="audioStatus">Toca 🎙️ para empezar a grabar. Toca otra vez para terminar.</div><div class="queue-status" id="queueStatus"></div></div>
</section>
<section class="view" data-view="linea"><section class="days" id="days"></section><div class="section-title" id="lineTitle">Línea temporal</div><section class="timeline" id="timeline"></section></section>
<section class="view" data-view="menu"><div class="section-title">Menú</div><div class="menu-list"><button class="menu-item" id="openMessaging"><span class="menu-main"><span class="menu-icon">💬</span><span class="menu-copy"><strong>Mensajería</strong><span>Mensajes generales de A.R.I.</span></span></span><span class="chev">›</span></button><button class="menu-item" id="updateApp"><span class="menu-main"><span class="menu-icon">↻</span><span class="menu-copy"><strong>Actualizar app</strong><span>Cargar la última versión sin cerrar A.R.I.</span></span></span><span class="chev">›</span></button><button class="menu-item" id="openAppearance"><span class="menu-main"><span class="menu-icon">◐</span><span class="menu-copy"><strong>Apariencia</strong><span>Oscuro, claro o automático</span></span></span><span class="chev">›</span></button></div><div class="update-status" id="updateStatus"></div></section>
<section class="view" data-view="mensajeria"><button class="back" data-back-menu>‹ Menú</button><div class="section-title">Mensajería</div><section class="panel"><div class="eyebrow">A.R.I.</div><h2>Mensaje general</h2><div class="meta">Audio o texto. La entrega remota seguirá pendiente hasta conectar el backend n8n.</div></section><div class="capture"><button class="round" id="msgMicBtn" aria-label="Grabar audio">🎙️</button><textarea id="msgInput" rows="1" placeholder="Escribe un mensaje…"></textarea><button class="send" id="sendMessage">Enviar</button></div><div class="audio-status" id="msgAudioStatus">Toca 🎙️ para grabar audio.</div><div class="queue-status" id="msgStatus"></div></section>
<section class="view" data-view="apariencia"><button class="back" data-back-menu>‹ Menú</button><div class="section-title">Apariencia</div><section class="panel"><div class="theme-row"><button class="theme-option" data-theme-choice="dark">🌙 Oscuro</button><button class="theme-option" data-theme-choice="light">☀️ Claro</button><button class="theme-option" data-theme-choice="auto">◐ Auto</button></div></section></section>
</main>
<nav class="bottom" id="bottomNav"><button class="nav active" data-target="ahora"><b>⌂</b>Ahora</button><button class="nav" data-target="linea"><b>│</b>Línea</button><button class="nav" data-target="menu"><b>☰</b>Menú</button><a class="nav" id="contextMusic" href="/ari/music/?resume=1" hidden><b>♫</b>Música</a></nav>
<script>
const CONTEXT_KEY='ari-context-system';function syncContextNav(){const music=localStorage.getItem(CONTEXT_KEY)==='music';contextMusic.hidden=!music;bottomNav.classList.toggle('has-context',music)}syncContextNav();addEventListener('storage',e=>{if(e.key===CONTEXT_KEY)syncContextNav()});const THEME_KEY='ari-theme',QUEUE_KEY='ari-note-queue',MSG_QUEUE_KEY='ari-message-queue',FEEDBACK_KEY='ari-feedback-state',NOTICE_KEY='ari-feedback-notified',TASK_STATE_KEY='ari-task-state',mediaDark=matchMedia('(prefers-color-scheme: dark)');
function storedTheme(){return localStorage.getItem(THEME_KEY)||'auto'}function applyTheme(choice=storedTheme()){const r=choice==='auto'?(mediaDark.matches?'dark':'light'):choice;document.documentElement.dataset.theme=r;themeColor.content=r==='dark'?'#050505':'#f5f1e8';document.querySelectorAll('.theme-option').forEach(b=>b.classList.toggle('active',b.dataset.themeChoice===choice))}function setTheme(c){localStorage.setItem(THEME_KEY,c);applyTheme(c)}mediaDark.addEventListener?.('change',()=>{if(storedTheme()==='auto')applyTheme('auto')});applyTheme();document.querySelectorAll('.theme-option').forEach(b=>b.onclick=()=>setTheme(b.dataset.themeChoice));
let calendarData=null,selectedDate='2026-09-07';const pad=n=>String(n).padStart(2,'0'),toMin=t=>{const[a,b]=t.split(':').map(Number);return a*60+b},fromMin=m=>`${pad(Math.floor((m+1440)%1440/60))}:${pad((m+1440)%1440%60)}`;function nowMadrid(){return new Date(new Date().toLocaleString('en-US',{timeZone:'Europe/Madrid'}))}function todayMadrid(){const n=nowMadrid();return `${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`}
function readJSON(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}function writeJSON(k,v){localStorage.setItem(k,JSON.stringify(v))}function feedbackState(){return readJSON(FEEDBACK_KEY,{})}function feedbackKey(e,date=todayMadrid()){return `${date}:${e.id||e.title}`}function markFeedback(e,status){const s=feedbackState();s[feedbackKey(e)]={status,at:new Date().toISOString()};writeJSON(FEEDBACK_KEY,s)}function hasFeedback(e,date=todayMadrid()){return !!feedbackState()[feedbackKey(e,date)]}
function taskKey(e,date=todayMadrid()){return `${date}:${e.id||e.title}`}function taskState(){return readJSON(TASK_STATE_KEY,{})}function isTaskDone(e,date=todayMadrid()){return !!taskState()[taskKey(e,date)]||((e.blocking||e.requires_response)&&hasFeedback(e,date))}function saveTaskDone(e,date=todayMadrid()){const s=taskState();s[taskKey(e,date)]={status:'completed',completed_at:new Date().toISOString()};writeJSON(TASK_STATE_KEY,s)}
function isFeedback(e){return e.feedback===true||String(e.title||'').startsWith('CIERRE ·')}function isTask(e){return e.kind==='task'||e.requires_response===true||isFeedback(e)}function blockEvents(date){return (calendarData?.days?.[date]||[]).filter(e=>!isTask(e))}
function synthFeedback(block){if(block.title==='DORMIR')return null;const end=toMin(block.end),start=fromMin(end-5);return{id:`feedback:${block.id}`,start,end:block.end,title:`CIERRE · ${block.title.replace(' · METAFILOSOFÍA · SOCIAL · ESTUDIO','').replace(' · MÚSICA','')}`,description:'¿Qué has hecho en este bloque? Responde por audio o texto.',kind:'task',feedback:true,blocking:false,capture_no_response:true,parent_block:block.title}}
function eventsForDate(date){const base=[...(calendarData?.days?.[date]||[])],titles=new Set(base.map(e=>e.title));for(const b of blockEvents(date)){const f=synthFeedback(b);if(f&&!titles.has(f.title))base.push(f)}return base.sort((a,b)=>toMin(a.start)-toMin(b.start)||(isTask(a)?1:-1))}
function visibleEvents(date){return eventsForDate(date).filter(e=>!isFeedback(e))}
function eventState(e,date){const n=nowMadrid(),today=todayMadrid(),s=toMin(e.start),en0=toMin(e.end),en=en0<=s?en0+1440:en0;if(isTask(e)&&isTaskDone(e,date))return'done';if(date<today)return isTask(e)?'overdue':'done';if(date>today)return'future';let x=n.getHours()*60+n.getMinutes();if(x<s&&en>1440)x+=1440;if(e.blocking&&x>=s&&!isTaskDone(e,date))return'active';if(isTask(e))return x>=s&&x<en?'active':x>=en?'overdue':'future';return x>=en?'done':x>=s?'active':'future'}
function currentFeedbackPrompt(){const date=todayMadrid(),x=nowMadrid().getHours()*60+nowMadrid().getMinutes();return eventsForDate(date).find(e=>isFeedback(e)&&!hasFeedback(e,date)&&x>=toMin(e.start)&&x<toMin(e.end))||null}
function activeEvent(){const date=todayMadrid(),list=visibleEvents(date),x=nowMadrid().getHours()*60+nowMadrid().getMinutes();const blocking=list.find(e=>e.blocking&&!isTaskDone(e,date)&&toMin(e.start)<=x);if(blocking)return blocking;const active=list.filter(e=>eventState(e,date)==='active');return active.find(e=>isTask(e)&&!isFeedback(e))||active[0]||null}
function nextTask(){const date=todayMadrid(),x=nowMadrid().getHours()*60+nowMadrid().getMinutes();return visibleEvents(date).filter(e=>isTask(e)&&!isTaskDone(e,date)&&toMin(e.start)>=x).sort((a,b)=>toMin(a.start)-toMin(b.start))[0]||null}
function renderDays(){days.innerHTML='';Object.keys(calendarData.days).forEach(date=>{const d=new Date(date+'T12:00:00'),el=document.createElement('button');el.className='day'+(date===selectedDate?' active':'');el.innerHTML=`<b>${new Intl.DateTimeFormat('es-ES',{weekday:'short'}).format(d)}</b><span>${d.getDate()}</span>`;el.onclick=()=>{selectedDate=date;renderAll()};days.appendChild(el)})}
function renderMessagingWorkspace(e){contextWorkspace.innerHTML=`<section class="workspace"><div class="workspace-head"><div><div class="eyebrow">Mensajería</div><div class="workspace-title">Mensajes pendientes</div></div><div class="workspace-pill">WhatsApp · pendiente</div></div><div class="workspace-body"><div class="workspace-empty"><strong>Aún no hay conversaciones cargadas</strong><span>La interfaz ya está preparada. Cuando conectemos WhatsApp, aquí aparecerán solo los mensajes pendientes para leer, resumir y responder sin salir de A.R.I.</span></div><div class="workspace-actions"><button class="workspace-btn" disabled>¿Quién me ha escrito?</button><button class="workspace-btn" disabled>Leer siguiente</button></div></div></section>`;nowCapture.classList.remove('hidden')}
function renderContextWorkspace(e){contextWorkspace.innerHTML='';nowCapture.classList.remove('hidden');if(!e)return;const t=String(e.title||'').toUpperCase();if(t.includes('VER MENSAJES PENDIENTES'))renderMessagingWorkspace(e)}
function renderNow(){const e=activeEvent()||nextTask();const active=activeEvent();nowTitle.textContent=e?e.title:'Sin bloque activo';nowMeta.textContent=e?`${isTask(e)?'TAREA':'BLOQUE'} · ${e.start}–${e.end}${!active&&isTask(e)?' · siguiente':''}`:`${todayMadrid()} · sin bloque activo`;renderContextWorkspace(e);completeTask.hidden=!(e&&isTask(e)&&!isTaskDone(e,todayMadrid())&&!e.blocking);completeTask.dataset.eventId=e?.id||''}
function taskRow(e){const st=eventState(e,selectedDate);return `<div class="task-row ${st}"><div class="task-time">${e.start}</div><div class="task-copy"><div class="task-label">TAREA</div><div class="task-title">${e.title}</div></div></div>`}
function renderTimeline(){timeline.innerHTML='';lineTitle.textContent=`Línea temporal · ${selectedDate}`;const list=visibleEvents(selectedDate),blocks=list.filter(e=>!isTask(e)),tasks=list.filter(e=>isTask(e));let bi=0;for(const b of blocks){const st=eventState(b,selectedDate),children=tasks.filter(t=>t.parent_block===b.title).sort((a,c)=>toMin(a.start)-toMin(c.start));timeline.insertAdjacentHTML('beforeend',`<article class="event block phase-${bi++%2?'b':'a'} ${st}"><div class="time">${b.start}</div><div class="block-head"><div class="event-kind">BLOQUE</div><div class="event-title">${b.title}</div><div class="event-meta">${b.start}–${b.end}</div></div>${children.length?`<div class="task-list">${children.map(taskRow).join('')}</div>`:''}</article>`)}for(const t of tasks.filter(t=>!t.parent_block||!blocks.some(b=>b.title===t.parent_block))){const st=eventState(t,selectedDate);timeline.insertAdjacentHTML('beforeend',`<article class="event standalone-task ${st}"><div class="time">${t.start}</div><div class="event-kind">TAREA</div><div class="event-title">${t.title}</div><div class="event-meta">${t.start}–${t.end}</div></article>`)} }function renderAll(){renderDays();renderNow();renderTimeline()}
function go(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.dataset.view===v));document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.target===v));history.replaceState(null,'','#'+v);scrollTo({top:0,behavior:'instant'})}document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>go(n.dataset.target));document.querySelectorAll('[data-back-menu]').forEach(b=>b.onclick=()=>go('menu'));openMessaging.onclick=()=>go('mensajeria');openAppearance.onclick=()=>go('apariencia');
async function registration(){if(!('serviceWorker'in navigator))throw Error('Service Worker no disponible');return navigator.serviceWorker.ready}async function notify(title,body,tag='ari-feedback'){try{if(!('Notification'in window)||Notification.permission!=='granted')return false;const r=await registration();await r.showNotification(title,{body,icon:'/ari/icon.svg',badge:'/ari/icon.svg',tag,data:{url:'/ari/#ahora'}});return true}catch(e){return false}}
async function triggerFeedbackNotifications(){if(!calendarData)return;const date=todayMadrid(),x=nowMadrid().getHours()*60+nowMadrid().getMinutes(),seen=readJSON(NOTICE_KEY,{});for(const e of eventsForDate(date)){if(!isFeedback(e)||hasFeedback(e,date))continue;const k=feedbackKey(e,date);if(x>=toMin(e.start)&&x<toMin(e.end)&&!seen[k]){seen[k]=new Date().toISOString();writeJSON(NOTICE_KEY,seen);await notify('A.R.I. · cierre de bloque',`¿Qué has hecho en ${e.parent_block||'este bloque'}? Respóndeme con audio o texto.`,`ari-close-${e.id}`)}}}
async function loadCalendar(){try{const r=await fetch('/ari/calendar.json?ts='+Date.now(),{cache:'no-store'});calendarData=await r.json();const t=todayMadrid();if(calendarData.days[t])selectedDate=t;captureNoResponses();await triggerFeedbackNotifications();renderAll()}catch(e){nowTitle.textContent='Error cargando calendario';nowMeta.textContent='No se pudo leer la línea temporal.'}}
function readQueue(k){return readJSON(k,[])}function writeQueue(k,v){writeJSON(k,v)}function refreshStatuses(){const q=readQueue(QUEUE_KEY),m=readQueue(MSG_QUEUE_KEY);queueStatus.textContent=q.length?`${q.length} captura${q.length===1?'':'s'} pendiente${q.length===1?'':'s'} de sincronizar.`:'';msgStatus.textContent=m.length?`${m.length} mensaje${m.length===1?'':'s'} pendiente${m.length===1?'':'s'} de sincronizar.`:''}
function captureNoResponses(){if(!calendarData)return;const date=todayMadrid(),x=nowMadrid().getHours()*60+nowMadrid().getMinutes(),q=readQueue(QUEUE_KEY);let changed=false;for(const e of eventsForDate(date)){if(!isFeedback(e)||hasFeedback(e,date))continue;if(x>=toMin(e.end)){q.push({id:crypto.randomUUID?.()||String(Date.now()),created_at:new Date().toISOString(),date,type:'feedback_no_response',block:e.parent_block||null,task:e.title,status:'queued',value:'NO_RESPUESTA'});markFeedback(e,'no_response');changed=true}}if(changed){writeQueue(QUEUE_KEY,q);refreshStatuses()}}
async function sendCapture(){const text=noteInput.value.trim(),feedback=currentFeedbackPrompt(),evt=feedback||activeEvent(),date=todayMadrid();if(!text){queueStatus.textContent='No hay texto para enviar.';await notify('A.R.I. · error','No se envió nada porque está vacío.','ari-note-error');return}const q=readQueue(QUEUE_KEY);q.push({id:crypto.randomUUID?.()||String(Date.now()),created_at:new Date().toISOString(),date,type:'text',block:evt?.parent_block||evt?.title||'SIN BLOQUE',task:isTask(evt)?evt?.title:null,text,status:'queued'});writeQueue(QUEUE_KEY,q);if(feedback)markFeedback(feedback,'responded');else if(evt?.blocking)markFeedback(evt,'responded');noteInput.value='';refreshStatuses();renderAll();await notify('A.R.I. · captura guardada',`${evt?.parent_block||evt?.title||'SIN BLOQUE'} · pendiente de sincronizar.`,'ari-note-queued')}
async function markCurrentTaskDone(){const e=activeEvent()||nextTask();if(!e||!isTask(e)||e.blocking||isTaskDone(e,todayMadrid()))return;saveTaskDone(e);const q=readQueue(QUEUE_KEY);q.push({id:crypto.randomUUID?.()||String(Date.now()),created_at:new Date().toISOString(),date:todayMadrid(),type:'task_completion',block:e.parent_block||null,task:e.title,event_id:e.id||null,status:'queued'});writeQueue(QUEUE_KEY,q);refreshStatuses();renderAll();await notify('A.R.I. · tarea completada',e.title,'ari-task-done')}
completeTask.onclick=markCurrentTaskDone;
async function sendGeneralMessage(){const text=msgInput.value.trim();if(!text){msgStatus.textContent='No hay mensaje para enviar.';return}const q=readQueue(MSG_QUEUE_KEY);q.push({id:crypto.randomUUID?.()||String(Date.now()),created_at:new Date().toISOString(),type:'text',text,status:'queued'});writeQueue(MSG_QUEUE_KEY,q);msgInput.value='';refreshStatuses();await notify('A.R.I. · mensaje guardado','Pendiente de sincronizar.','ari-msg-queued')}
sendNote.onclick=sendCapture;noteInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendCapture()}});sendMessage.onclick=sendGeneralMessage;msgInput.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendGeneralMessage()}});
function openAudioDB(){return new Promise((res,rej)=>{const r=indexedDB.open('ari-audio',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('clips'))r.result.createObjectStore('clips',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function saveClip(blob,meta){const db=await openAudioDB();return new Promise((res,rej)=>{const tx=db.transaction('clips','readwrite');tx.objectStore('clips').put({...meta,blob});tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function setupRecorder(btn,statusEl,queueKey,general=false){let rec=null,chunks=[],started=0,stream=null;btn.onclick=async()=>{if(rec&&rec.state==='recording'){rec.stop();return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){statusEl.textContent='Grabación de audio no disponible en este dispositivo.';await notify('A.R.I. · audio','Grabación no disponible.','ari-audio-unavailable');return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];started=Date.now();rec=new MediaRecorder(stream);rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=async()=>{btn.classList.remove('recording');btn.textContent='🎙️';stream?.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'}),id=crypto.randomUUID?.()||String(Date.now()),duration_ms=Date.now()-started,feedback=general?null:currentFeedbackPrompt(),evt=general?null:(feedback||activeEvent()),date=todayMadrid();await saveClip(blob,{id,created_at:new Date().toISOString(),mime_type:blob.type,duration_ms});const q=readQueue(queueKey);q.push({id:crypto.randomUUID?.()||String(Date.now()),created_at:new Date().toISOString(),date,type:'audio',audio_id:id,mime_type:blob.type,duration_ms,block:general?null:(evt?.parent_block||evt?.title||'SIN BLOQUE'),task:general?null:(isTask(evt)?evt?.title:null),status:'queued_audio'});writeQueue(queueKey,q);if(feedback)markFeedback(feedback,'responded');else if(evt?.blocking)markFeedback(evt,'responded');refreshStatuses();renderAll();statusEl.textContent=`Audio guardado · ${Math.max(1,Math.round(duration_ms/1000))} s · pendiente de sincronizar y transcribir.`;await notify('A.R.I. · audio guardado','Pendiente de sincronizar y transcribir.','ari-audio-saved')};rec.start();btn.classList.add('recording');btn.textContent='■';statusEl.textContent='Grabando… toca ■ para terminar.'}catch(e){statusEl.textContent='No pude acceder al micrófono.';await notify('A.R.I. · error de audio','No se pudo iniciar la grabación.','ari-audio-error')}}}
setupRecorder(micBtn,audioStatus,QUEUE_KEY,false);setupRecorder(msgMicBtn,msgAudioStatus,MSG_QUEUE_KEY,true);
updateApp.onclick=async()=>{updateStatus.textContent='Actualizando A.R.I.…';try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs)await r.update()}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('ari-')).map(k=>caches.delete(k)))}updateStatus.textContent='Nueva versión cargada.';const u=new URL(location.href);u.searchParams.set('refresh',Date.now());location.replace(u.toString())}catch(e){updateStatus.textContent='No pude actualizar. Inténtalo de nuevo.'}};
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/ari/sw.js').catch(()=>{}));refreshStatuses();go(location.hash.slice(1)||'ahora');loadCalendar();setInterval(async()=>{captureNoResponses();await triggerFeedbackNotifications();renderAll()},30000);
</script>
