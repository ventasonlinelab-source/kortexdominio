<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e8decf"><title>A.R.I. · HERMES · DEMO</title><style>:root{font-family:Inter,system-ui,-apple-system,sans-serif;--bg:#e8decf;--p:#f7efe3;--p2:#eadfce;--ln:#d3c2aa;--ac:#a9792d;--tx:#2d261f;--mu:#7f705e;--ok:#547562;--hy:#8f7147;--bot:rgba(244,234,219,.97)}html[data-theme=dark]{--bg:#050505;--p:#101010;--p2:#171717;--ln:#2b2b2b;--ac:#c9a45b;--tx:#f2f2f2;--mu:#9b9b9b;--ok:#7aa286;--hy:#b99966;--bot:rgba(5,5,5,.97);color-scheme:dark}html[data-theme=red-night]{--bg:#090000;--p:#120202;--p2:#1a0303;--ln:#3a0d0d;--ac:#d65a4f;--tx:#efb1a8;--mu:#ad625b;--ok:#d77a70;--hy:#c66359;--bot:rgba(9,0,0,.98);color-scheme:dark}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--tx)}.app{max-width:1120px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(90px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;gap:9px;margin-bottom:12px;min-height:38px}.brand{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:900;letter-spacing:.1em}.brand img{width:34px;height:34px}.back{position:fixed;top:calc(12px + env(safe-area-inset-top));right:max(14px,calc((100vw - 1120px)/2 + 14px));z-index:80;color:var(--ac);text-decoration:none;border:1px solid var(--ln);background:var(--p);border-radius:999px;padding:9px 12px;font-size:9px;font-weight:900;box-shadow:0 4px 18px color-mix(in srgb,var(--tx) 9%,transparent)}.hero,.panel{border:1px solid var(--ln);background:var(--p);border-radius:20px;padding:18px}.hero h1{font-size:clamp(24px,4vw,38px);line-height:1.05;margin:7px 0}.ey{font-size:9px;color:var(--ac);letter-spacing:.14em;font-weight:900}.meta{font-size:10px;color:var(--mu);line-height:1.5}.ready{display:inline-block;margin-top:10px;border:1px solid var(--ok);color:var(--ok);border-radius:999px;padding:6px 9px;font-size:9px;font-weight:900}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px}.kpi{background:var(--p2);border:1px solid var(--ln);border-radius:12px;padding:10px}.k{font-size:7px;color:var(--mu);letter-spacing:.1em}.v{font-size:16px;font-weight:900;margin-top:4px}.tabs{position:sticky;top:calc(10px + env(safe-area-inset-top));z-index:50;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:10px 0;padding:4px 150px 4px 4px;border:1px solid var(--ln);background:var(--p);border-radius:14px}.tab{border:0;background:transparent;color:var(--mu);padding:10px;border-radius:10px;font-size:9px;font-weight:900;letter-spacing:.08em}.tab.active{background:var(--p2);color:var(--ac)}.panel{min-height:390px}.view[hidden]{display:none}.head{display:flex;justify-content:space-between;gap:14px;align-items:end;margin-bottom:12px}.head h2{font-size:24px;margin:5px 0 0}.note{max-width:420px;font-size:10px;color:var(--mu);line-height:1.45}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.card{border:1px solid var(--ln);background:var(--p2);border-radius:14px;padding:12px}.tag{font-size:8px;font-weight:900;letter-spacing:.1em;color:var(--ok)}.card.hyp{border-style:dashed}.card.hyp .tag{color:var(--hy)}.card p{font-size:12px;line-height:1.5;margin:6px 0}.src{font-size:8px;color:var(--mu)}.label{font-size:9px;font-weight:900;letter-spacing:.1em;color:var(--mu);margin:14px 0 7px}.rule{margin-top:10px;border-left:3px solid var(--ac);background:var(--p2);padding:10px;border-radius:0 10px 10px 0;font-size:10px;color:var(--mu);line-height:1.45}.journeyWrap{display:grid;grid-template-columns:1.45fr .55fr;gap:10px}.flow,.preview{border:1px solid var(--ln);background:var(--p2);border-radius:16px;padding:13px}.flowTop{display:flex;justify-content:space-between;align-items:center;gap:8px}.sim{font-size:8px;color:var(--ok);font-weight:900}.play{border:1px solid var(--ac);background:var(--p);color:var(--ac);border-radius:10px;padding:8px 10px;font-size:8px;font-weight:900}.journey{display:grid;grid-template-columns:repeat(8,minmax(76px,1fr));overflow-x:auto;margin-top:15px}.node{border:0;background:transparent;color:var(--mu);min-width:76px;text-align:center;padding:0 4px}.dot{width:34px;height:34px;margin:auto;border-radius:50%;display:grid;place-items:center;border:1px solid var(--ln);background:var(--p);font-size:9px;font-weight:900}.nt{font-size:8px;font-weight:800;line-height:1.2;margin-top:6px}.node.active{color:var(--ac)}.node.active .dot{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 12%,transparent)}.node.passed .dot{background:var(--ok);border-color:var(--ok);color:var(--p)}.preview{min-height:240px;display:flex;flex-direction:column}.state{font-size:8px;color:var(--ac);font-weight:900;letter-spacing:.1em}.preview h3{font-size:21px;margin:6px 0}.preview p{font-size:12px;line-height:1.5}.dash{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:auto}.d{border:1px solid var(--ln);background:var(--p);border-radius:10px;padding:8px}.dv{font-size:9px;font-weight:900;margin-top:3px}.trace{margin-top:10px;border:1px solid var(--ln);border-radius:13px;padding:0 12px}.trace summary{padding:11px 0;cursor:pointer;color:var(--ac);font-size:9px;font-weight:900}.tg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding-bottom:12px}.tc{border-top:1px solid var(--ln);padding-top:7px;min-width:0}.tv{font-size:9px;font-weight:800;overflow-wrap:anywhere;margin-top:3px}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(1120px,100%);padding:8px 24px calc(8px + env(safe-area-inset-bottom));background:var(--bot);backdrop-filter:blur(12px);border-top:1px solid var(--ln);display:grid;grid-template-columns:repeat(4,1fr);z-index:60}.nav{text-decoration:none;text-align:center;color:var(--mu);font-size:9px}.nav b{display:block;font-size:16px}.nav.active{color:var(--ac)}.err{color:#b44}.loading{min-height:280px;display:grid;place-items:center;color:var(--mu)}@media(max-width:760px){.kpis{grid-template-columns:1fr 1fr}.journeyWrap{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}.tg{grid-template-columns:1fr}.tabs{padding-right:140px}}@media(max-width:520px){.app{padding-left:10px;padding-right:10px}.brand span{display:none}.back{right:10px}.hero,.panel{padding:14px}.kpi .v{font-size:14px}.journey{grid-template-columns:repeat(8,82px)}.flowTop{align-items:flex-start;flex-direction:column}.play{width:100%}.bottom{padding-left:10px;padding-right:10px}.tabs{padding-right:4px;top:calc(56px + env(safe-area-inset-top))}}</style></head><body><main class="app"><header class="top"><div class="brand"><img src="/ari/icon.svg" alt="A.R.I."><div>A.R.I. · HERMES <span>· DEMO COMERCIAL</span></div></div><a class="back" href="/ari/hermes/">← VOLVER A HERMES</a></header><section class="hero" id="hero"><div class="loading">Cargando DEMO V0…</div></section><nav class="tabs" id="tabs" hidden><button class="tab" data-v="ahora">AHORA</button><button class="tab" data-v="fuga">FUGA</button><button class="tab" data-v="despues">DESPUÉS</button></nav><section class="panel" id="panel" hidden><div class="view" id="ahora"></div><div class="view" id="fuga" hidden></div><div class="view" id="despues" hidden></div></section></main><nav class="bottom"><a class="nav" href="/ari/#ahora"><b>⌂</b>Ahora</a><a class="nav" href="/ari/#linea"><b>│</b>Línea</a><a class="nav" href="/ari/#menu"><b>☰</b>Menú</a><a class="nav active" href="/ari/hermes/"><b>◆</b>Hermes</a></nav><script>(()=>{const API='https://n8n.kortex10x.com/hermes-dashboard/api/demo',TK='ari-theme',CK='ari-context-system';let d,step=0,timer=null;const q=x=>document.getElementById(x),e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function theme(){let t=localStorage.getItem(TK);if(!t||t==='light'||t==='auto')t='sepia';if(!['sepia','dark','red-night'].includes(t))t='sepia';document.documentElement.dataset.theme=t;localStorage.setItem(CK,'hermes')}theme();addEventListener('storage',x=>{if(x.key===TK)theme()});function fact(x){return `<article class="card"><div class="tag">HECHO · ${e(x.id)}</div><p>${e(x.text)}</p><div class="src">FUENTE · ${e(x.source)}</div></article>`}function hyp(x){return `<article class="card hyp"><div class="tag">HIPÓTESIS · ${e(x.id)}</div><p>${e(x.text)}</p><div class="src">BASE · ${e((x.basis||[]).join(' + '))}</div></article>`}function hero(){const c=d.clinic||{},text=(d.ahora?.facts||[]).map(x=>x.text).join(' '),score=text.match(/SCORE válido\s+([\d,.]+)/i)?.[1]||'—',sig=text.match(/~([\d,.]+)\s+visitas\/mes/i)?.[1]||'—';q('hero').innerHTML=`<div class="ey">HERMES · DEMO V0 · AHORA → FUGA → DESPUÉS</div><h1>${e(c.name)}</h1><div class="meta">${e(c.address)} · ${e(c.domain)}</div><span class="ready">${e(d.status)}</span><div class="kpis"><div class="kpi"><div class="k">SCORE</div><div class="v">${e(score)}</div></div><div class="kpi"><div class="k">SEÑAL DIGITAL</div><div class="v">${e(sig==='—'?'—':sig+'/mes')}</div></div><div class="kpi"><div class="k">DECISOR</div><div class="v">RESUELTO</div></div><div class="kpi"><div class="k">OUTBOUND REAL</div><div class="v">0</div></div></div>`}function renderAhora(){q('ahora').innerHTML=`<div class="head"><div><div class="ey">AHORA · SITUACIÓN OBSERVABLE</div><h2>Qué sabemos hoy</h2></div><div class="note">Solo hechos ya persistidos. Las estimaciones no se presentan como leads, citas ni ingresos.</div></div><div class="cards">${(d.ahora?.facts||[]).map(fact).join('')}</div><div class="rule">${e(d.ahora?.summary)}</div>`}function renderFuga(){q('fuga').innerHTML=`<div class="head"><div><div class="ey">FUGA · OPORTUNIDAD</div><h2>Hechos vs hipótesis</h2></div><div class="note">La oportunidad queda visible sin vender como demostrada una pérdida aún no medida.</div></div><div class="label">HECHOS OBSERVABLES</div><div class="cards">${(d.fuga?.facts||[]).map(fact).join('')}</div><div class="label">HIPÓTESIS A VALIDAR</div><div class="cards">${(d.fuga?.hypotheses||[]).map(hyp).join('')}</div><div class="rule">${e(d.fuga?.rule)}</div>`}function trace(){const c=d.clinic||{},a=d.artifact||{};return `<details class="trace"><summary>TRAZABILIDAD +</summary><div class="tg">${[['DEMO_ID',d.demo_id],['VERSIÓN',d.version],['IDENTIDAD',c.company_key||c.business_id],['COHORT_ID',d.cohort_id],['RUN_ID',d.run_id],['RUTA',a.route],['CREADA',d.created_at],['ESTADO',d.status]].map(x=>`<div class="tc"><div class="k">${e(x[0])}</div><div class="tv">${e(x[1])}</div></div>`).join('')}</div></details>`}function renderDespues(){const j=d.despues?.journey||[];q('despues').innerHTML=`<div class="head"><div><div class="ey">DESPUÉS · SIMULACIÓN REALISTA</div><h2>Una lead recorriendo el sistema</h2></div><div class="note">Simulación interna: 0 mensajes externos, 0 cita real, 0 CERRAR.</div></div><div class="journeyWrap"><div class="flow"><div class="flowTop"><div class="sim">SIMULACIÓN · 0 EFECTOS EXTERNOS</div><button class="play" id="play">▶ REPRODUCIR RECORRIDO</button></div><div class="journey" id="journey">${j.map((x,i)=>`<button class="node" data-i="${i}"><span class="dot">${String(i+1).padStart(2,'0')}</span><div class="nt">${e(x.title)}</div></button>`).join('')}</div><div class="rule">Lead entra → Identificación → Cualificación → Seguimiento → Respuesta → Recuperación → Cita → Dashboard</div></div><aside class="preview" id="preview"></aside></div>${trace()}`;q('journey').onclick=x=>{const b=x.target.closest('[data-i]');if(b)sel(+b.dataset.i)};q('play').onclick=play;sel(step)}function sel(i){const j=d.despues?.journey||[];step=Math.max(0,Math.min(i,j.length-1));document.querySelectorAll('.node').forEach((n,k)=>{n.classList.toggle('active',k===step);n.classList.toggle('passed',k<step)});const x=j[step],o=d.despues?.operational_side_effects||{};q('preview').innerHTML=`<div class="state">${e(x.state)}</div><h3>${e(x.title)}</h3><p>${e(x.detail)}</p><div class="dash"><div class="d"><div class="k">LEAD DEMO</div><div class="dv">${e(d.despues?.lead_demo_id)}</div></div><div class="d"><div class="k">PASO</div><div class="dv">${step+1}/${j.length}</div></div><div class="d"><div class="k">CITAS REALES</div><div class="dv">${e(o.appointments??0)}</div></div><div class="d"><div class="k">CERRAR REAL</div><div class="dv">${e(o.closes??0)}</div></div></div>`}function play(){const j=d.despues?.journey||[];if(timer){clearInterval(timer);timer=null;q('play').textContent='▶ REPRODUCIR RECORRIDO';return}step=0;sel(0);q('play').textContent='■ DETENER';timer=setInterval(()=>{if(step>=j.length-1){clearInterval(timer);timer=null;q('play').textContent='↻ REPETIR RECORRIDO'}else sel(step+1)},850)}function show(v,push=true){if(!['ahora','fuga','despues'].includes(v))v='ahora';document.querySelectorAll('.view').forEach(x=>x.hidden=x.id!==v);document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.v===v));if(push&&location.hash!==`#${v}`)history.replaceState(null,'',`#${v}`)}q('tabs').onclick=x=>{const b=x.target.closest('[data-v]');if(b)show(b.dataset.v)};addEventListener('hashchange',()=>show(location.hash.slice(1),false));fetch(API,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(x=>{d=x;if(d.status!=='DEMO_READY')throw Error('DEMO no preparada');hero();renderAhora();renderFuga();renderDespues();q('tabs').hidden=false;q('panel').hidden=false;show(location.hash.slice(1)||'ahora',false)}).catch(x=>q('hero').innerHTML=`<div class="loading err">No se pudo abrir la DEMO V0 · ${e(x.message)}</div>`)} )();</script></body></html>
