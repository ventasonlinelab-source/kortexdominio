<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F8F8F6">
<title>Russo Dental · Experiencia de paciente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{font-family:Montserrat,system-ui,-apple-system,sans-serif;--bg:#f8f8f6;--paper:#fff;--soft:#f1f2ed;--sage:#bec4aa;--sage2:#dee1d4;--sand:#ac9b89;--ink:#313131;--text:#4d4d4d;--muted:#7f7f7f;--line:#ded8d2;--ok:#6f8063;--hyp:#9b8067;--shadow:0 20px 60px rgba(49,49,49,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text)}button,a{font:inherit}.app{max-width:1180px;margin:auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(34px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:15px}.logo{width:min(220px,48vw);height:auto;display:block}.internal-link{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--text);border:1px solid var(--line);background:rgba(255,255,255,.8);border-radius:999px;padding:10px 13px;font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}.hero,.panel,.closing{border:1px solid var(--line);background:var(--paper);border-radius:26px;box-shadow:var(--shadow);overflow:hidden}.hero{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(320px,.92fr);min-height:390px}.hero-copy{padding:clamp(24px,4.5vw,52px);display:flex;flex-direction:column;justify-content:center}.ey{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--sand);font-weight:700}.hero h1{font-size:clamp(30px,5.2vw,58px);line-height:1.02;font-weight:300;letter-spacing:-.03em;color:var(--ink);margin:11px 0 14px}.hero p{font-size:clamp(12px,1.5vw,15px);line-height:1.65;color:var(--muted);max-width:620px;margin:0}.hero-media{position:relative;min-height:310px}.hero-media img{width:100%;height:100%;object-fit:cover;display:block}.hero-media:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(248,248,246,.17),transparent 35%)}.story{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:24px}.pill{padding:8px 11px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:8px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text)}.arrow{color:var(--sand);font-size:13px}.tabs{position:sticky;top:7px;z-index:15;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:12px 0;padding:5px;border:1px solid var(--line);background:rgba(248,248,246,.92);backdrop-filter:blur(14px);border-radius:18px}.tab{border:0;background:transparent;color:var(--muted);padding:12px 8px;border-radius:12px;font-size:10px;font-weight:600;letter-spacing:.11em}.tab.active{background:var(--sage2);color:var(--ink)}.panel{padding:clamp(18px,3.2vw,31px);min-height:410px}.view[hidden]{display:none}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:18px}.head h2{font-size:clamp(25px,4vw,39px);font-weight:300;letter-spacing:-.02em;color:var(--ink);margin:6px 0 0}.note{font-size:10px;line-height:1.55;color:var(--muted);max-width:390px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.card{border:1px solid var(--line);background:var(--soft);border-radius:18px;padding:16px;min-width:0}.tag{font-size:8px;font-weight:700;letter-spacing:.13em;color:var(--ok)}.card h3{font-size:16px;font-weight:500;color:var(--ink);margin:10px 0 5px}.card strong{display:block;font-size:clamp(17px,2.2vw,24px);font-weight:500;color:var(--ink);margin:8px 0;overflow-wrap:anywhere}.card p{font-size:11px;color:var(--muted);line-height:1.55;margin:0}.est{font-size:8px;color:var(--muted);margin-top:8px}.hyp{background:#fbfaf8;border-style:dashed}.hyp .tag{color:var(--hyp)}.truth{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--sage);background:color-mix(in srgb,var(--sage2) 48%,white);border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:10px;line-height:1.55}.truth b{color:var(--ok);letter-spacing:.1em}.journeygrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,.55fr);gap:11px}.flow,.preview{border:1px solid var(--line);background:var(--soft);border-radius:19px;padding:15px}.flowtop{display:flex;justify-content:space-between;align-items:center;gap:12px}.sim{font-size:8px;color:var(--ok);font-weight:700;letter-spacing:.1em}.play{border:1px solid var(--sage);background:var(--paper);color:var(--ink);border-radius:12px;padding:9px 11px;font-size:9px;font-weight:600}.journey{display:grid;grid-template-columns:repeat(8,minmax(88px,1fr));overflow-x:auto;padding:18px 0 13px;scrollbar-width:thin}.node{position:relative;border:0;background:transparent;color:var(--muted);min-width:88px;text-align:center;padding:0 4px}.node:before{content:"";position:absolute;height:2px;background:var(--line);left:0;right:0;top:20px}.node:first-child:before{left:50%}.node:last-child:before{right:50%}.dot{position:relative;z-index:1;width:40px;height:40px;margin:auto;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--paper);font-size:10px;font-weight:600}.nt{font-size:8px;font-weight:600;line-height:1.25;margin-top:8px}.node.active{color:var(--ink)}.node.active .dot{border-color:var(--sage);box-shadow:0 0 0 6px rgba(190,196,170,.24)}.node.passed .dot{background:var(--sage);border-color:var(--sage);color:#fff}.preview{min-height:260px;display:flex;flex-direction:column}.state{font-size:8px;color:var(--sand);font-weight:700;letter-spacing:.12em}.preview h3{font-size:24px;font-weight:400;color:var(--ink);margin:8px 0}.preview p{font-size:12px;color:var(--muted);line-height:1.6;margin:0}.mini{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:auto;padding-top:15px}.m{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:9px}.mk{font-size:7px;color:var(--muted);letter-spacing:.09em}.mv{font-size:10px;font-weight:600;color:var(--ink);margin-top:4px}.dash-preview{display:grid;gap:7px;margin-top:14px}.dash-row{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:8px;font-size:9px}.dash-row span{color:var(--muted)}.dash-row b{color:var(--ink);font-weight:600;text-align:right}.closing{margin-top:12px;padding:clamp(20px,3vw,28px);display:flex;justify-content:space-between;align-items:center;gap:18px}.closing h3{font-size:clamp(20px,3vw,28px);font-weight:300;color:var(--ink);margin:6px 0}.closing p{font-size:11px;line-height:1.55;color:var(--muted);margin:0;max-width:700px}.closing .internal-link{background:var(--sage2);border-color:var(--sage)}.loading{min-height:320px;display:grid;place-items:center;color:var(--muted);font-size:11px}.err{color:#9d655e}.trace{display:none}
@media(max-width:850px){.hero{grid-template-columns:1fr}.hero-media{min-height:260px;order:-1}.hero-media:after{background:linear-gradient(0deg,rgba(248,248,246,.12),transparent 45%)}.cards{grid-template-columns:1fr 1fr}.journeygrid{grid-template-columns:1fr}.closing{align-items:flex-start;flex-direction:column}}
@media(max-width:560px){.app{padding-left:10px;padding-right:10px}.top{align-items:center;gap:8px}.logo{width:min(160px,47vw)}.internal-link{padding:8px 9px;font-size:7px}.hero,.panel,.closing{border-radius:21px}.hero-media{min-height:210px}.hero-copy{padding:22px 18px 24px}.story{gap:5px;margin-top:18px}.pill{font-size:7px;padding:7px 8px}.head{align-items:flex-start;flex-direction:column}.cards{grid-template-columns:1fr}.flowtop{align-items:flex-start;flex-direction:column}.play{width:100%}.journey{grid-template-columns:repeat(8,84px)}.node{min-width:84px}.mini{grid-template-columns:1fr 1fr}.closing .internal-link{width:100%}}
</style>
</head>
<body>
<main class="app">
<header class="top"><img class="logo" src="/ari/hermes/demo/assets/russo-logo.png" alt="Russo Dental"><a class="internal-link" href="/ari/hermes/">← Vista interna</a></header>
<section class="hero" id="hero"><div class="loading">Preparando la experiencia…</div></section>
<nav class="tabs" id="tabs" hidden><button class="tab" data-v="ahora">AHORA</button><button class="tab" data-v="fuga">FUGA</button><button class="tab" data-v="despues">DESPUÉS</button></nav>
<section class="panel" id="panel" hidden><div class="view" id="ahora"></div><div class="view" id="fuga" hidden></div><div class="view" id="despues" hidden></div></section>
<section class="closing" id="close" hidden><div><div class="ey">RUSSO DENTAL</div><h3>De una consulta a una cita visible.</h3><p>Esta vista usa señales reales de la clínica y un recorrido futuro simulado. No envía mensajes ni crea citas reales.</p></div><a class="internal-link" href="/ari/hermes/">Volver a HERMES · vista interna</a></section>
</main>
<script>
(()=>{const API='https://n8n.kortex10x.com/hermes-dashboard/api/demo';let d,step=0,timer=null;const q=x=>document.getElementById(x),e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fact(id){return(d.ahora?.facts||[]).find(x=>x.id===id)?.text||''}function signal(){return fact('F3').match(/~([\d,.]+)\s+visitas\/mes/i)?.[1]||'—'}function responsible(){return fact('F4').match(/identifica a (.+?) como/i)?.[1]||'Responsable público identificado'}function hero(){const c=d.clinic||{};q('hero').innerHTML=`<div class="hero-copy"><div class="ey">EXPERIENCIA RUSSO DENTAL</div><h1>De cada consulta a una oportunidad visible.</h1><p>Una vista preparada sobre ${e((c.name||'Russo Dental').replace(/^Clinica\s+/i,'').replace(/\s*-\s*Tu dentista.*$/i,''))} para explorar el recorrido desde la entrada hasta la cita, separando lo observado de lo que aún hay que validar.</p><div class="story"><span class="pill">AHORA</span><span class="arrow">→</span><span class="pill">FUGA</span><span class="arrow">→</span><span class="pill">DESPUÉS</span></div></div><div class="hero-media"><img src="/ari/hermes/demo/assets/russo-clinica.jpg" alt="Clínica Russo Dental"></div>`}function renderAhora(){const c=d.clinic||{},s=signal(),r=responsible();q('ahora').innerHTML=`<div class="head"><div><div class="ey">AHORA</div><h2>Lo que ya vemos</h2></div><div class="note">Solo señales observadas en los datos usados para esta vista.</div></div><div class="cards"><article class="card"><div class="tag">HECHO</div><h3>Presencia digital</h3><strong>${e(c.domain||'Web identificada')}</strong><p>Web pública identificada y validada.</p></article><article class="card"><div class="tag">HECHO</div><h3>Señal digital</h3><strong>${e(s==='—'?'—':'~'+s+'/mes')}</strong><p>Estimación de visitas usada como señal.</p><div class="est">No equivale a leads, citas ni ingresos.</div></article><article class="card"><div class="tag">HECHO</div><h3>Responsable visible</h3><strong style="font-size:17px">${e(r)}</strong><p>Identificado en información pública.</p></article></div>`}function renderFuga(){const hs=d.fuga?.hypotheses||[],s=signal(),names={H1:'Seguimiento',H2:'Recuperación',H3:'Visibilidad'};q('fuga').innerHTML=`<div class="head"><div><div class="ey">FUGA</div><h2>Lo que puede quedar invisible</h2></div><div class="note">Una hipótesis no es una pérdida demostrada.</div></div><div class="truth"><b>HECHO</b><span>${e(s==='—'?'Existe una señal digital estimada.':'Existe una señal estimada de ~'+s+' visitas/mes.')} Aún no demuestra cuántas terminan en lead o cita.</span></div><div class="cards">${hs.map(h=>`<article class="card hyp"><div class="tag">HIPÓTESIS</div><h3>${e(names[h.id]||'Por validar')}</h3><p>${e(h.text)}</p></article>`).join('')}</div>`}const clientDetail={'Lead entra':'Una persona solicita una valoración desde un formulario de demostración.','Identificación':'La oportunidad queda reconocida y vinculada a Russo Dental sin duplicarse.','Cualificación':'Implante · plazo 30 días · zona Alicante. Prioridad simulada: media.','Seguimiento':'Si no hay respuesta, queda preparado un seguimiento dentro de la simulación.','Respuesta':'La persona indica que prefiere la tarde y pregunta por la primera valoración.','Recuperación':'Tras una pausa, el contexto se conserva y la oportunidad se reabre.','Cita':'La simulación muestra una cita el jueves a las 18:00. No se crea ningún evento real.','Dashboard':'Todo queda visible en un único panel: estado, siguiente acción y cita simulada.'};function dashboardRows(){return `<div class="dash-preview"><div class="dash-row"><span>Lead</span><b>Valoración de implante</b></div><div class="dash-row"><span>Estado</span><b>Cita simulada</b></div><div class="dash-row"><span>Preferencia</span><b>Tarde</b></div><div class="dash-row"><span>Cita</span><b>Jueves · 18:00</b></div></div>`}function renderDespues(){const j=d.despues?.journey||[];q('despues').innerHTML=`<div class="head"><div><div class="ey">DESPUÉS</div><h2>Una lead recorriendo el sistema</h2></div><div class="note">Pulsa cada etapa o reproduce el recorrido. Todo lo que ocurre aquí es una simulación.</div></div><div class="journeygrid"><div class="flow"><div class="flowtop"><div class="sim">RECORRIDO DEMOSTRATIVO · SIN EFECTOS EXTERNOS</div><button class="play" id="play">▶ REPRODUCIR</button></div><div class="journey" id="journey">${j.map((x,i)=>`<button class="node" data-i="${i}"><span class="dot">${i+1}</span><div class="nt">${e(x.title)}</div></button>`).join('')}</div></div><aside class="preview" id="preview"></aside></div>`;q('journey').onclick=x=>{const b=x.target.closest('[data-i]');if(b)sel(+b.dataset.i)};q('play').onclick=play;sel(step)}function sel(i){const j=d.despues?.journey||[];if(!j.length)return;step=Math.max(0,Math.min(i,j.length-1));document.querySelectorAll('.node').forEach((n,k)=>{n.classList.toggle('active',k===step);n.classList.toggle('passed',k<step)});const x=j[step];q('preview').innerHTML=`<div class="state">ETAPA ${step+1} DE ${j.length}</div><h3>${e(x.title)}</h3><p>${e(clientDetail[x.title]||'Etapa de la simulación.')}</p>${x.title==='Dashboard'?dashboardRows():`<div class="mini"><div class="m"><div class="mk">RECORRIDO</div><div class="mv">${step+1} / ${j.length}</div></div><div class="m"><div class="mk">ESTADO</div><div class="mv">DEMOSTRACIÓN</div></div></div>`}`;document.querySelector('.node.active')?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}function play(){const j=d.despues?.journey||[];if(timer){clearInterval(timer);timer=null;q('play').textContent='▶ REPRODUCIR';return}step=0;sel(0);q('play').textContent='■ DETENER';timer=setInterval(()=>{if(step>=j.length-1){clearInterval(timer);timer=null;q('play').textContent='↻ REPETIR'}else sel(step+1)},900)}function show(v,push=true){if(!['ahora','fuga','despues'].includes(v))v='ahora';document.querySelectorAll('.view').forEach(x=>x.hidden=x.id!==v);document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.v===v));if(push&&location.hash!==`#${v}`)history.replaceState(null,'',`#${v}`)}q('tabs').onclick=x=>{const b=x.target.closest('[data-v]');if(b)show(b.dataset.v)};addEventListener('hashchange',()=>show(location.hash.slice(1),false));fetch(API,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(x=>{d=x;if(!d?.clinic||!Array.isArray(d?.despues?.journey))throw Error('Datos no disponibles');hero();renderAhora();renderFuga();renderDespues();q('tabs').hidden=false;q('panel').hidden=false;q('close').hidden=false;show(location.hash.slice(1)||'ahora',false)}).catch(x=>q('hero').innerHTML=`<div class="loading err">No se pudo abrir la vista · ${e(x.message)}</div>`)} )();
</script>
</body>
</html>
