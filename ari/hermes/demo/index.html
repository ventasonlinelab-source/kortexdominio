<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4eadb"><title>Russo Dental · DEMO CLIENTE</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;--bg:#f4eadb;--p:#fbf4e9;--p2:#eee1cf;--ln:#d8c5aa;--ac:#9b6d25;--tx:#2d261f;--mu:#7b6d5b;--ok:#547562;--hy:#9b7130;--sh:0 18px 55px rgba(74,55,31,.09)}html[data-theme=dark]{--bg:#050505;--p:#101010;--p2:#171717;--ln:#2b2b2b;--ac:#c9a45b;--tx:#f2f2f2;--mu:#9b9b9b;--ok:#7aa286;--hy:#b99966;--sh:0 18px 60px rgba(0,0,0,.28);color-scheme:dark}html[data-theme=red-night]{--bg:#090000;--p:#120202;--p2:#1a0303;--ln:#3a0d0d;--ac:#d65a4f;--tx:#efb1a8;--mu:#ad625b;--ok:#d77a70;--hy:#c66359;--sh:0 18px 60px rgba(0,0,0,.3);color-scheme:dark}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--tx)}button,a{font:inherit}.app{max-width:1160px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}.brand{display:flex;align-items:center;gap:9px}.brand img{width:34px;height:34px}.brand b{font-size:11px;letter-spacing:.09em}.brand span{display:block;font-size:9px;color:var(--mu);margin-top:2px}.back{color:var(--ac);text-decoration:none;border:1px solid var(--ln);background:var(--p);border-radius:999px;padding:9px 12px;font-size:9px;font-weight:900;letter-spacing:.06em;white-space:nowrap}.hero,.panel,.close{border:1px solid var(--ln);background:var(--p);border-radius:22px;box-shadow:var(--sh)}.hero{padding:clamp(20px,4vw,40px);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:290px;height:290px;border:55px solid color-mix(in srgb,var(--ac) 9%,transparent);border-radius:50%;right:-145px;top:-155px}.ey{font-size:9px;color:var(--ac);letter-spacing:.15em;font-weight:900;text-transform:uppercase}.hero h1{font-size:clamp(28px,5vw,50px);line-height:1.03;margin:8px 0 9px;max-width:800px;position:relative;z-index:1}.hero p{font-size:clamp(11px,1.8vw,15px);color:var(--mu);line-height:1.5;max-width:720px;margin:0;position:relative;z-index:1}.story{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:19px;position:relative;z-index:1}.pill{border:1px solid var(--ln);background:var(--p2);border-radius:999px;padding:8px 10px;font-size:9px;font-weight:900}.arr{color:var(--ac);font-weight:900}.tabs{position:sticky;top:6px;z-index:20;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:11px 0;padding:5px;border:1px solid var(--ln);background:color-mix(in srgb,var(--p) 92%,transparent);backdrop-filter:blur(14px);border-radius:16px}.tab{border:0;background:transparent;color:var(--mu);padding:11px 7px;border-radius:11px;font-size:10px;font-weight:900;letter-spacing:.08em}.tab.active{background:var(--p2);color:var(--ac)}.panel{padding:clamp(16px,3vw,27px);min-height:410px}.view[hidden]{display:none}.head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:16px}.head h2{font-size:clamp(23px,3.7vw,34px);margin:5px 0 0}.note{font-size:10px;color:var(--mu);line-height:1.45;max-width:390px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.card{border:1px solid var(--ln);background:var(--p2);border-radius:17px;padding:14px}.tag{font-size:8px;font-weight:900;letter-spacing:.11em;color:var(--ok)}.card h3{font-size:17px;margin:9px 0 5px}.card strong{display:block;font-size:21px;margin:7px 0}.card p{font-size:11px;color:var(--mu);line-height:1.5;margin:0}.est{font-size:8px;color:var(--mu);margin-top:7px}.hyp{border-style:dashed}.hyp .tag{color:var(--hy)}.truth{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--ln);background:var(--p2);border-radius:15px;padding:11px 13px;margin-bottom:11px;font-size:10px;line-height:1.45}.truth b{color:var(--ok);letter-spacing:.08em}.journeygrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(250px,.5fr);gap:11px}.flow,.preview{border:1px solid var(--ln);background:var(--p2);border-radius:18px;padding:14px}.flowtop{display:flex;justify-content:space-between;align-items:center;gap:10px}.sim{font-size:8px;color:var(--ok);font-weight:900;letter-spacing:.08em}.play{border:1px solid var(--ac);background:var(--p);color:var(--ac);border-radius:11px;padding:9px 11px;font-size:9px;font-weight:900}.journey{display:grid;grid-template-columns:repeat(8,minmax(84px,1fr));overflow-x:auto;padding:16px 0 12px;scrollbar-width:thin}.node{position:relative;border:0;background:transparent;color:var(--mu);min-width:84px;text-align:center;padding:0 4px}.node:before{content:"";position:absolute;height:2px;background:var(--ln);left:0;right:0;top:19px}.node:first-child:before{left:50%}.node:last-child:before{right:50%}.dot{position:relative;z-index:1;width:38px;height:38px;margin:auto;border-radius:50%;display:grid;place-items:center;border:1px solid var(--ln);background:var(--p);font-size:10px;font-weight:900}.nt{font-size:8px;font-weight:900;line-height:1.2;margin-top:7px}.node.active{color:var(--ac)}.node.active .dot{border-color:var(--ac);box-shadow:0 0 0 5px color-mix(in srgb,var(--ac) 12%,transparent)}.node.passed .dot{background:var(--ok);border-color:var(--ok);color:var(--p)}.preview{min-height:235px;display:flex;flex-direction:column}.state{font-size:8px;color:var(--ac);font-weight:900;letter-spacing:.1em}.preview h3{font-size:23px;margin:7px 0}.preview p{font-size:12px;color:var(--mu);line-height:1.55;margin:0}.mini{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:auto;padding-top:14px}.m{border:1px solid var(--ln);background:var(--p);border-radius:11px;padding:8px}.mk{font-size:7px;color:var(--mu);letter-spacing:.08em}.mv{font-size:10px;font-weight:900;margin-top:3px}.close{margin-top:11px;padding:clamp(17px,3vw,26px);display:flex;justify-content:space-between;align-items:center;gap:16px}.close h3{font-size:clamp(18px,2.8vw,25px);margin:4px 0 6px}.close p{font-size:11px;color:var(--mu);line-height:1.5;margin:0;max-width:650px}.loading{min-height:290px;display:grid;place-items:center;color:var(--mu);font-size:11px}.err{color:#9d655e}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.journeygrid{grid-template-columns:1fr}.close{align-items:flex-start;flex-direction:column}}@media(max-width:560px){.app{padding-left:10px;padding-right:10px}.top{align-items:flex-start}.brand span{display:none}.back{padding:8px 9px}.hero{border-radius:19px}.story{gap:5px}.pill{font-size:8px;padding:7px 8px}.panel{border-radius:19px}.head{align-items:flex-start;flex-direction:column}.cards{grid-template-columns:1fr}.flowtop{align-items:flex-start;flex-direction:column}.play{width:100%}.journey{grid-template-columns:repeat(8,84px)}.mini{grid-template-columns:1fr 1fr}}
</style></head><body><main class="app"><header class="top"><div class="brand"><img src="/ari/icon.svg" alt="A.R.I."><div><b>RUSSO DENTAL · DEMO CLIENTE</b><span>Una simulación visual sobre tu clínica</span></div></div><a class="back" href="/ari/hermes/">← HERMES · VISTA INTERNA</a></header><section class="hero" id="hero"><div class="loading">Preparando la demo…</div></section><nav class="tabs" id="tabs" hidden><button class="tab" data-v="ahora">AHORA</button><button class="tab" data-v="fuga">FUGA</button><button class="tab" data-v="despues">DESPUÉS</button></nav><section class="panel" id="panel" hidden><div class="view" id="ahora"></div><div class="view" id="fuga" hidden></div><div class="view" id="despues" hidden></div></section><section class="close" id="close" hidden><div><div class="ey">SIGUIENTE PASO</div><h3>De simulación a números reales</h3><p>Esta es una simulación sobre tu clínica. En una llamada podemos conectarlo a tus números reales.</p></div><a class="back" href="/ari/hermes/">VOLVER A HERMES</a></section></main><script>
(()=>{const API='https://n8n.kortex10x.com/hermes-dashboard/api/demo',TK='ari-theme',CK='ari-context-system';let d,step=0,timer=null;const q=x=>document.getElementById(x),e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function theme(){let t=localStorage.getItem(TK);if(!t||t==='light'||t==='auto')t='sepia';if(!['sepia','dark','red-night'].includes(t))t='sepia';document.documentElement.dataset.theme=t;localStorage.setItem(CK,'hermes')}theme();addEventListener('storage',x=>{if(x.key===TK)theme()});function fact(id){return(d.ahora?.facts||[]).find(x=>x.id===id)?.text||''}function signal(){return fact('F3').match(/~([\d,.]+)\s+visitas\/mes/i)?.[1]||'—'}function responsible(){return fact('F4').match(/identifica a (.+?) como/i)?.[1]||'Responsable público identificado'}function hero(){const c=d.clinic||{};q('hero').innerHTML=`<div class="ey">DEMO CLIENTE V0 · AHORA → FUGA → DESPUÉS</div><h1>${e(c.name||'Tu clínica')}</h1><p>${e(c.address||'')} ${c.domain?`· ${e(c.domain)}`:''}</p><div class="story"><span class="pill">AHORA · qué vemos</span><span class="arr">→</span><span class="pill">FUGA · qué puede escaparse</span><span class="arr">→</span><span class="pill">DESPUÉS · cómo se recupera</span></div>`}function renderAhora(){const c=d.clinic||{},s=signal(),r=responsible();q('ahora').innerHTML=`<div class="head"><div><div class="ey">AHORA</div><h2>Tu punto de partida</h2></div><div class="note">Solo señales observadas en los datos reales usados para esta demo.</div></div><div class="cards"><article class="card"><div class="tag">HECHO</div><h3>Presencia digital</h3><strong>${e(c.domain||'Web identificada')}</strong><p>Web pública identificada y validada en la preparación de la clínica.</p></article><article class="card"><div class="tag">HECHO</div><h3>Señal de demanda</h3><strong>${e(s==='—'?'—':'~'+s+'/mes')}</strong><p>Estimación de visitas usada en esta demo. No equivale a leads, citas ni ingresos.</p><div class="est">ESTIMACIÓN · no resultado comercial demostrado</div></article><article class="card"><div class="tag">HECHO</div><h3>Responsable visible</h3><strong style="font-size:17px">${e(r)}</strong><p>Identificado en información pública de la clínica.</p></article></div>`}function renderFuga(){const hs=d.fuga?.hypotheses||[],s=signal(),names={H1:'Seguimiento',H2:'Recuperación',H3:'Visibilidad'};q('fuga').innerHTML=`<div class="head"><div><div class="ey">FUGA</div><h2>Lo que hoy puede quedar invisible</h2></div><div class="note">Hechos e hipótesis aparecen separados. Una hipótesis no es una pérdida demostrada.</div></div><div class="truth"><b>HECHO</b><span>${e(s==='—'?'Existe una señal digital estimada.':'Existe una señal estimada de ~'+s+' visitas/mes.')} Eso no demuestra cuántos leads o citas genera.</span></div><div class="cards">${hs.map(h=>`<article class="card hyp"><div class="tag">HIPÓTESIS</div><h3>${e(names[h.id]||'Por validar')}</h3><p>${e(h.text)}</p></article>`).join('')}</div>`}const clientDetail={'Lead entra':'Una lead solicita una valoración desde un formulario de demostración.','Identificación':'El sistema reconoce la oportunidad y la vincula a la clínica sin duplicarla.','Cualificación':'Necesidad de implante, plazo de 30 días y zona Alicante. Resultado simulado: prioridad media.','Seguimiento':'Si no hay respuesta, el sistema prepara un seguimiento dentro de la simulación.','Respuesta':'La lead indica que prefiere la tarde y pregunta por la primera valoración.','Recuperación':'Tras una pausa, el contexto se conserva y la oportunidad se reabre sin crear un segundo lead.','Cita':'La simulación muestra una cita el jueves a las 18:00. No se crea ningún evento real.','Dashboard':'La clínica ve el estado, la siguiente acción, el tiempo de respuesta y la cita simulada en un único panel.'};function renderDespues(){const j=d.despues?.journey||[];q('despues').innerHTML=`<div class="head"><div><div class="ey">DESPUÉS</div><h2>Una lead recorriendo el sistema</h2></div><div class="note">Pulsa cada etapa o reproduce el recorrido. Es una simulación: no contacta a nadie ni crea una cita real.</div></div><div class="journeygrid"><div class="flow"><div class="flowtop"><div class="sim">SIMULACIÓN · SIN EFECTOS EXTERNOS</div><button class="play" id="play">▶ REPRODUCIR RECORRIDO</button></div><div class="journey" id="journey">${j.map((x,i)=>`<button class="node" data-i="${i}"><span class="dot">${i+1}</span><div class="nt">${e(x.title)}</div></button>`).join('')}</div></div><aside class="preview" id="preview"></aside></div>`;q('journey').onclick=x=>{const b=x.target.closest('[data-i]');if(b)sel(+b.dataset.i)};q('play').onclick=play;sel(step)}function sel(i){const j=d.despues?.journey||[];if(!j.length)return;step=Math.max(0,Math.min(i,j.length-1));document.querySelectorAll('.node').forEach((n,k)=>{n.classList.toggle('active',k===step);n.classList.toggle('passed',k<step)});const x=j[step];q('preview').innerHTML=`<div class="state">ETAPA ${step+1} DE ${j.length}</div><h3>${e(x.title)}</h3><p>${e(clientDetail[x.title]||'Etapa de la simulación.')}</p><div class="mini"><div class="m"><div class="mk">RECORRIDO</div><div class="mv">${step+1} / ${j.length}</div></div><div class="m"><div class="mk">RESULTADO</div><div class="mv">SIMULACIÓN</div></div></div>`;document.querySelector('.node.active')?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'})}function play(){const j=d.despues?.journey||[];if(timer){clearInterval(timer);timer=null;q('play').textContent='▶ REPRODUCIR RECORRIDO';return}step=0;sel(0);q('play').textContent='■ DETENER';timer=setInterval(()=>{if(step>=j.length-1){clearInterval(timer);timer=null;q('play').textContent='↻ REPETIR RECORRIDO'}else sel(step+1)},900)}function show(v,push=true){if(!['ahora','fuga','despues'].includes(v))v='ahora';document.querySelectorAll('.view').forEach(x=>x.hidden=x.id!==v);document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.v===v));if(push&&location.hash!==`#${v}`)history.replaceState(null,'',`#${v}`)}q('tabs').onclick=x=>{const b=x.target.closest('[data-v]');if(b)show(b.dataset.v)};addEventListener('hashchange',()=>show(location.hash.slice(1),false));fetch(API,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(x=>{d=x;if(!d?.clinic||!Array.isArray(d?.despues?.journey))throw Error('Datos no disponibles');hero();renderAhora();renderFuga();renderDespues();q('tabs').hidden=false;q('panel').hidden=false;q('close').hidden=false;show(location.hash.slice(1)||'ahora',false)}).catch(x=>q('hero').innerHTML=`<div class="loading err">No se pudo abrir la DEMO CLIENTE · ${e(x.message)}</div>`)} )();
</script></body></html>
