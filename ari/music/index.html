<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#f1efe8"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>A.R.I. · Música</title>
<style>
:root{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:light;
  --bg:#eceae4;
  --chrome:#f8f7f3;
  --chrome2:#f1efe9;
  --panel:#ffffff;
  --grid:#e4e1d9;
  --grid-strong:#d1cdc2;
  --line:#d8d4ca;
  --text:#1e211f;
  --muted:#7b7d78;
  --accent:#b78b36;
  --accent-soft:#f2e8d2;
  --record:#d85b58;
  --record-soft:#f9e4e2;
  --dark:#202320;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#161816;
  --chrome:#202320;
  --chrome2:#1b1e1b;
  --panel:#242724;
  --grid:#2c302c;
  --grid-strong:#3a3f3a;
  --line:#353a35;
  --text:#eeeee9;
  --muted:#999d98;
  --accent:#d2a24c;
  --accent-soft:#3a3121;
  --record:#e46c68;
  --record-soft:#442827;
  --dark:#f0f0eb;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{height:100dvh;display:grid;grid-template-rows:52px 44px minmax(0,1fr) 36px 58px;background:var(--bg)}
.topbar{display:grid;grid-template-columns:220px 1fr 220px;align-items:center;padding:0 14px;border-bottom:1px solid var(--line);background:var(--chrome)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand img{width:28px;height:28px}.brand-copy{min-width:0}.brand-title{font-weight:850;font-size:13px;letter-spacing:.01em}.brand-sub{font-size:9px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.project{justify-self:center;display:flex;align-items:center;gap:10px;font-size:11px}.project strong{font-size:12px}.pill{border:1px solid var(--line);background:var(--chrome2);border-radius:7px;padding:5px 8px;color:var(--muted);font-size:10px;font-weight:750}
.top-actions{display:flex;justify-content:flex-end;gap:7px}.iconbtn{width:32px;height:32px;border:1px solid var(--line);background:var(--panel);border-radius:7px;font-weight:800}.iconbtn:hover{border-color:var(--grid-strong)}
.transport{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 14px;border-bottom:1px solid var(--line);background:var(--chrome2)}
.transport-left,.transport-right{display:flex;align-items:center;gap:7px}.transport-right{justify-content:flex-end}.tempo{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--muted)}.tempo strong{color:var(--text);font-size:12px}.transport-center{display:flex;align-items:center;gap:6px}.tbtn{height:30px;min-width:34px;border:1px solid var(--line);background:var(--panel);border-radius:6px;font-weight:850}.tbtn.play{background:var(--dark);color:var(--chrome);border-color:var(--dark)}.tbtn.record{width:auto;padding:0 11px;border-color:color-mix(in srgb,var(--record) 45%,var(--line));background:var(--record-soft);color:var(--record)}
.workspace{display:grid;grid-template-columns:54px minmax(0,1fr);min-height:0}
.rail{border-right:1px solid var(--line);background:var(--chrome);padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:6px}.railbtn{width:40px;height:40px;border:0;background:transparent;border-radius:7px;color:var(--muted);font-size:16px}.railbtn.active{background:var(--accent-soft);color:var(--accent)}.railbtn:hover{background:var(--chrome2);color:var(--text)}.rail-spacer{flex:1}
.arrangement{min-width:0;min-height:0;display:grid;grid-template-rows:32px minmax(0,1fr);background:var(--panel);position:relative}
.ruler{position:relative;border-bottom:1px solid var(--line);background:var(--chrome2);overflow:hidden}.ruler-grid{position:absolute;inset:0;background-image:repeating-linear-gradient(to right,transparent 0,transparent calc(6.25% - 1px),var(--grid-strong) calc(6.25% - 1px),var(--grid-strong) 6.25%)}.ruler-labels{position:absolute;inset:0;display:grid;grid-template-columns:repeat(16,1fr);align-items:center}.ruler-labels span{padding-left:6px;font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums}
.canvas{position:relative;overflow:auto;background:var(--panel)}.grid{position:absolute;inset:0;min-width:1100px;min-height:100%;background-image:repeating-linear-gradient(to right,transparent 0,transparent calc(6.25% - 1px),var(--grid) calc(6.25% - 1px),var(--grid) 6.25%),repeating-linear-gradient(to bottom,transparent 0,transparent 47px,color-mix(in srgb,var(--grid) 65%,transparent) 47px,color-mix(in srgb,var(--grid) 65%,transparent) 48px)}
.playhead{position:absolute;top:0;bottom:0;left:6.25%;width:1px;background:var(--accent);z-index:5}.playhead:before{content:'';position:absolute;top:0;left:-4px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:7px solid var(--accent)}
.empty-state{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);text-align:center;z-index:6;pointer-events:none}.empty-title{font-size:16px;font-weight:850;letter-spacing:-.01em}.empty-copy{margin-top:6px;font-size:11px;color:var(--muted)}
.corner{position:absolute;left:14px;top:14px;display:flex;gap:6px}.mini{border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(6px);border-radius:6px;height:27px;padding:0 9px;font-size:9px;color:var(--muted);font-weight:760}
.devicebar{display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-top:1px solid var(--line);background:var(--chrome2);font-size:10px;color:var(--muted)}.devicebar strong{color:var(--text)}.handle{font-size:14px;color:var(--muted)}
.bottom{display:grid;grid-template-columns:repeat(4,1fr);align-items:center;border-top:1px solid var(--line);background:var(--chrome);padding:4px max(12px,env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}.nav{text-decoration:none;text-align:center;color:var(--muted);font-size:9px;font-weight:700}.nav b{display:block;font-size:15px;line-height:1.05;margin-bottom:2px}.nav.active{color:var(--accent)}
@media(max-width:820px){.topbar{grid-template-columns:160px 1fr 120px}.brand-sub{display:none}.project .pill{display:none}.transport{grid-template-columns:auto 1fr auto}.transport-left .pill{display:none}.workspace{grid-template-columns:46px 1fr}.rail{padding-left:3px;padding-right:3px}.railbtn{width:38px}.empty-title{font-size:15px}}
@media(max-width:560px){.topbar{grid-template-columns:1fr auto}.project{display:none}.top-actions .iconbtn:first-child{display:none}.transport-left{display:none}.transport{grid-template-columns:1fr auto;padding-left:8px;padding-right:8px}.transport-center{justify-self:start}.transport-right{justify-self:end}.tbtn.record{padding:0 8px}.shell{grid-template-rows:48px 44px minmax(0,1fr) 34px 56px}}
</style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div class="brand"><img src="/ari/icon.svg" alt="A.R.I."><div class="brand-copy"><div class="brand-title">MÚSICA</div><div class="brand-sub">DAW · V2</div></div></div>
    <div class="project"><span class="pill">ARRANGEMENT</span><strong>Sin título</strong><span class="pill">4/4</span></div>
    <div class="top-actions"><button class="iconbtn" id="themeBtn" aria-label="Cambiar tema">◐</button><button class="iconbtn" id="menuBtn" aria-label="Volver a menú">×</button></div>
  </header>

  <section class="transport">
    <div class="transport-left"><div class="tempo"><span>BPM</span><strong>72.00</strong></div><span class="pill">D minor</span></div>
    <div class="transport-center"><button class="tbtn" aria-label="Stop">■</button><button class="tbtn play" aria-label="Play">▶</button><button class="tbtn record" aria-label="Grabar">● REC</button></div>
    <div class="transport-right"><span class="pill">1.1.1</span><span class="pill">00:00.0</span></div>
  </section>

  <section class="workspace">
    <aside class="rail" aria-label="Herramientas">
      <button class="railbtn active" title="Arrangement">▥</button>
      <button class="railbtn" title="Browser">⌕</button>
      <button class="railbtn" title="Clips">◫</button>
      <button class="railbtn" title="Dispositivos">◇</button>
      <div class="rail-spacer"></div>
      <button class="railbtn" title="Añadir">＋</button>
    </aside>

    <section class="arrangement">
      <div class="ruler"><div class="ruler-grid"></div><div class="ruler-labels" id="rulerLabels"></div></div>
      <div class="canvas" id="canvas">
        <div class="grid"></div>
        <div class="playhead"></div>
        <div class="corner"><button class="mini">SNAP</button><button class="mini">1 BAR</button></div>
        <div class="empty-state"><div class="empty-title">Arrangement vacío</div><div class="empty-copy">Añade audio, crea una pista o empieza a grabar.</div></div>
      </div>
    </section>
  </section>

  <section class="devicebar"><div><strong>DISPOSITIVOS</strong> · panel cerrado</div><span class="handle">⌃</span></section>

  <nav class="bottom"><a class="nav ari-exit" href="/ari/#ahora"><b>⌂</b>Ahora</a><a class="nav ari-exit" href="/ari/#linea"><b>│</b>Línea</a><a class="nav ari-exit" href="/ari/#menu"><b>☰</b>Menú</a><a class="nav active" href="/ari/music/"><b>♫</b>Música</a></nav>
</main>
<script>
(()=>{
const THEME_KEY='ari-theme',CONTEXT_KEY='ari-context-system';
const mediaDark=matchMedia('(prefers-color-scheme: dark)');
const root=document.documentElement;
function stored(){return localStorage.getItem(THEME_KEY)||'auto'}
function apply(choice=stored()){const resolved=choice==='auto'?(mediaDark.matches?'dark':'light'):choice;root.dataset.theme=resolved;document.querySelector('meta[name="theme-color"]').content=resolved==='dark'?'#161816':'#f1efe8'}
localStorage.setItem(CONTEXT_KEY,'music');apply();
mediaDark.addEventListener?.('change',()=>{if(stored()==='auto')apply('auto')});
addEventListener('storage',e=>{if(e.key===THEME_KEY)apply()});
const labels=document.getElementById('rulerLabels');for(let i=1;i<=16;i++){const s=document.createElement('span');s.textContent=i;labels.appendChild(s)}
document.getElementById('menuBtn').onclick=()=>location.assign('/ari/#menu');
document.getElementById('themeBtn').onclick=()=>{const next=stored()==='light'?'dark':stored()==='dark'?'auto':'light';localStorage.setItem(THEME_KEY,next);apply(next)};
document.querySelectorAll('.ari-exit').forEach(a=>a.addEventListener('click',()=>sessionStorage.setItem('ari-music-resume','1')));
})();
</script>
</body>
</html>
