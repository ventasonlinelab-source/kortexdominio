<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#050505"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>A.R.I. · Música</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;--bg:#050505;--panel:#0c0a07;--panel2:#100c08;--line:#2d2519;--gold:#d8a84b;--text:#f4efe4;--muted:#9d927f;--bottom:rgba(5,5,5,.97);--record:#c84c45}
html[data-theme="light"]{color-scheme:light;--bg:#f5f1e8;--panel:#fffdf8;--panel2:#f3ecdf;--line:#d7c9b0;--gold:#9a6a1d;--text:#211b13;--muted:#746956;--bottom:rgba(245,241,232,.97);--record:#a73a35}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input{font:inherit}.app{max-width:1180px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(92px + env(safe-area-inset-bottom))}.top{display:grid;grid-template-columns:80px 1fr 80px;align-items:center;gap:10px}.back{border:0;background:none;color:var(--gold);font-weight:800;padding:10px 0;text-align:left}.logo{width:34px;height:34px;margin:auto}.headrow{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:10px 0 12px}.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}h1{font-size:22px;margin:5px 0}.meta,.status,.tiny{font-size:11px;color:var(--muted)}.panel,.bar,.track{border:1px solid var(--line);background:var(--panel);border-radius:16px}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px;margin-bottom:10px;flex-wrap:wrap}.group{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;min-height:40px;padding:0 13px;font-weight:800}.btn.primary{border-color:var(--gold);color:var(--gold)}.btn.record{border-color:var(--record);color:var(--record)}.btn.record.live{background:var(--record);color:#fff}.btn.auto.on{border-color:var(--gold);color:var(--gold)}.read{font-variant-numeric:tabular-nums;font-size:11px;color:var(--muted);min-width:110px;text-align:right}.timeline{position:relative;border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:auto}.ruler,.track{min-width:760px}.ruler{height:36px;position:relative;border-bottom:1px solid var(--line);background:var(--panel)}.tick{position:absolute;top:10px;transform:translateX(-50%);font-size:9px;color:var(--muted)}.head{position:absolute;top:0;bottom:0;width:1px;background:var(--gold);z-index:20;pointer-events:none}.head:before{content:'';position:absolute;top:28px;left:-5px;width:11px;height:11px;border-radius:50%;background:var(--gold)}.tracks{display:grid;gap:0}.track{border:0;border-radius:0;display:grid;grid-template-columns:150px minmax(610px,1fr);min-height:108px}.track+.track{border-top:1px solid var(--line)}.label{position:sticky;left:0;z-index:10;background:var(--panel);border-right:1px solid var(--line);padding:14px}.name{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:900}.armed{display:inline-block;font-size:8px;letter-spacing:.08em;color:var(--record);border:1px solid var(--record);border-radius:999px;padding:2px 5px}.lane{position:relative;padding:12px}.clip{height:78px;border:1px solid #6c5730;background:var(--panel2);border-radius:10px;overflow:hidden;position:relative}.clip.voice{border-style:dashed}.clip.recorded{border-style:solid;border-color:var(--record)}.clip-title{position:absolute;left:9px;top:7px;z-index:2;font-size:9px;color:var(--muted);font-weight:800}.wave{position:absolute;inset:0;width:100%;height:100%}.empty{height:78px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:10px}.statusline{display:flex;justify-content:space-between;gap:12px;padding:8px 2px}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(1180px,100%);padding:9px 28px calc(9px + env(safe-area-inset-bottom));background:var(--bottom);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:50}.nav{text-decoration:none;text-align:center;color:var(--muted);font-size:10px}.nav.active{color:var(--gold)}.nav b{display:block;font-size:17px}.recbadge{display:none;color:var(--record);font-weight:900;font-size:10px}.recbadge.on{display:inline}.error{color:var(--record)}
@media(max-width:720px){.app{padding-left:10px;padding-right:10px}.headrow{align-items:start;flex-direction:column}.bar{align-items:flex-start}.read{text-align:left}.ruler,.track{min-width:700px}.track{grid-template-columns:130px 570px}.bottom{padding-left:12px;padding-right:12px}}
</style>
</head>
<body>
<main class="app" id="app">
<header class="top"><button class="back" id="back">‹ MENÚ</button><img class="logo" src="/ari/icon.svg" alt="A.R.I."/><span></span></header>
<div class="headrow"><div><div class="eyebrow">MÚSICA · DAW</div><h1 id="projectTitle">Cargando proyecto…</h1><div class="meta" id="projectMeta">Sincronizando con A.R.I. Music</div></div><div class="read" id="read">00:00.0 / 00:00.0</div></div>
<div class="bar">
  <div class="group"><button class="btn" id="stop">■</button><button class="btn primary" id="play">▶</button><button class="btn record" id="record">● GRABAR</button><span class="recbadge" id="recbadge">● MIC ACTIVO</span></div>
  <div class="group"><button class="btn" id="refresh">ACTUALIZAR</button><button class="btn auto" id="auto">AUTO</button></div>
</div>
<div class="timeline" id="timeline">
  <div class="ruler" id="ruler"></div>
  <div class="tracks" id="tracks"></div>
  <div class="head" id="head"></div>
</div>
<div class="statusline"><div class="status" id="status">Conectando…</div><div class="tiny" id="saveState"></div></div>
<audio id="pianoAudio" preload="metadata"></audio>
<audio id="voiceAudio" preload="metadata"></audio>
</main>
<nav class="bottom"><a class="nav ari-exit" href="/ari/#ahora"><b>⌂</b>Ahora</a><a class="nav ari-exit" href="/ari/#linea"><b>│</b>Línea</a><a class="nav ari-exit" href="/ari/#menu"><b>☰</b>Menú</a><a class="nav active" href="/ari/music/"><b>♫</b>Música</a></nav>
<script>
(()=>{
const PROJECT_API='/ari/music/api/project',RECORD_API='/ari/music/api/recording';
const THEME_KEY='ari-theme',CONTEXT_KEY='ari-context-system',AUTO_KEY='ari-music-auto';
const mediaDark=matchMedia('(prefers-color-scheme: dark)');
const $=id=>document.getElementById(id);
const piano=$('pianoAudio'),voice=$('voiceAudio'),tracks=$('tracks'),ruler=$('ruler'),head=$('head'),status=$('status'),saveState=$('saveState');
let project=null,duration=0,playing=false,raf=0,autoTimer=0,mediaRecorder=null,micStream=null,chunks=[],recordStart=0,voiceTake=null;
function storedTheme(){return localStorage.getItem(THEME_KEY)||'auto'}
function applyTheme(choice=storedTheme()){const r=choice==='auto'?(mediaDark.matches?'dark':'light'):choice;document.documentElement.dataset.theme=r;document.querySelector('meta[name="theme-color"]').content=r==='dark'?'#050505':'#f5f1e8'}
localStorage.setItem(CONTEXT_KEY,'music');applyTheme();mediaDark.addEventListener?.('change',()=>{if(storedTheme()==='auto')applyTheme('auto')});addEventListener('storage',e=>{if(e.key===THEME_KEY)applyTheme()});
document.querySelectorAll('.ari-exit').forEach(a=>a.addEventListener('click',()=>sessionStorage.setItem('ari-music-resume','1')));
$('back').onclick=()=>location.assign('/ari/#menu');
const fmt=t=>`${String(Math.floor((t||0)/60)).padStart(2,'0')}:${((t||0)%60).toFixed(1).padStart(4,'0')}`;
function setStatus(text,error=false){status.textContent=text;status.classList.toggle('error',error)}
function wave(canvas,seed=0,voiceWave=false){requestAnimationFrame(()=>{const dpr=devicePixelRatio||1,w=Math.max(300,canvas.clientWidth*dpr),h=Math.max(50,canvas.clientHeight*dpr);canvas.width=w;canvas.height=h;const c=canvas.getContext('2d');c.clearRect(0,0,w,h);c.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue(voiceWave?'--record':'--gold').trim();c.globalAlpha=.72;c.beginPath();for(let i=0;i<320;i++){const x=i/319*w,a=voiceWave?(.10+.36*Math.abs(Math.sin(i*.16+seed)*Math.sin(i*.053+2))):(.12+.30*Math.abs(Math.sin(i*.19+seed)*Math.sin(i*.071+1)));c.moveTo(x,h/2-a*h/2);c.lineTo(x,h/2+a*h/2)}c.stroke()})}
function drawRuler(){ruler.innerHTML='';const step=duration>90?15:10;for(let t=0;t<=duration+.01;t+=step){const s=document.createElement('span');s.className='tick';s.style.left=`${duration?t/duration*100:0}%`;s.textContent=`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;ruler.appendChild(s)}}
function renderTracks(){tracks.innerHTML='';const active=project?.active_tracks||[];active.forEach((t,i)=>{const row=document.createElement('div');row.className='track';const isVoice=t.id==='voice'||t.kind==='recording';row.innerHTML=`<div class="label"><div class="name">${t.name||t.id.toUpperCase()} ${isVoice&&t.armed?'<span class="armed">ARMADA</span>':''}</div><div class="meta">${isVoice?'Micrófono · Input':'Audio · Piano triste'}</div></div><div class="lane"></div>`;const lane=row.querySelector('.lane');if(!isVoice){lane.innerHTML='<div class="clip"><span class="clip-title">PIANO · AUDIO</span><canvas class="wave"></canvas></div>';wave(lane.querySelector('canvas'),i)}else if(voiceTake){const left=duration?Math.max(0,recordStart/duration*100):0,width=duration?Math.min(100-left,voiceTake.duration/duration*100):100;lane.innerHTML=`<div class="clip voice recorded" style="margin-left:${left}%;width:${Math.max(2,width)}%"><span class="clip-title">VOZ · TOMA GUARDADA</span><canvas class="wave"></canvas></div>`;wave(lane.querySelector('canvas'),3,true)}else{lane.innerHTML='<div class="empty">● Pulsa GRABAR para activar el micrófono</div>'}tracks.appendChild(row)});}
function updateHead(){const t=piano.currentTime||0;$('read').textContent=`${fmt(t)} / ${fmt(duration)}`;head.style.left=`${duration?t/duration*100:0}%`;if(voiceTake&&voice.src){const target=Math.max(0,t-recordStart);if(playing&&t>=recordStart&&target<voiceTake.duration){if(Math.abs((voice.currentTime||0)-target)>.22)voice.currentTime=target;if(voice.paused)voice.play().catch(()=>{})}else if(!voice.paused)voice.pause()}if(playing){if(piano.ended||t>=duration-.03){stopAll()}else raf=requestAnimationFrame(updateHead)}}
async function loadProject(silent=false){if(!silent)setStatus('Actualizando proyecto…');try{const r=await fetch(PROJECT_API,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const j=await r.json();if(!j.ok||!j.project)throw new Error('project_invalid');project=j.project;duration=Number(project.duration)||0;$('projectTitle').textContent=project.title||project.project_id||'MÚSICA';$('projectMeta').textContent=`${project.bpm||'—'} BPM · ${project.key||'—'} · ${project.meter||'4/4'}`;if(project.piano_url&&piano.src!==project.piano_url){const was=playing,at=piano.currentTime||0;piano.src=project.piano_url;piano.load();piano.addEventListener('loadedmetadata',()=>{if(!duration&&Number.isFinite(piano.duration))duration=piano.duration;piano.currentTime=Math.min(at,duration||at);if(was)piano.play().catch(()=>{})},{once:true})}drawRuler();renderTracks();updateHead();setStatus(`Proyecto sincronizado · ${project.project_id}`);return true}catch(e){setStatus(`No se pudo actualizar · ${e.message}`,true);return false}}
function playPause(){if(!project)return;if(playing){piano.pause();voice.pause();playing=false;$('play').textContent='▶';cancelAnimationFrame(raf);updateHead();return}piano.play().then(()=>{playing=true;$('play').textContent='❚❚';raf=requestAnimationFrame(updateHead)}).catch(e=>setStatus(`No se pudo reproducir · ${e.message}`,true))}
function stopAll(){piano.pause();voice.pause();playing=false;$('play').textContent='▶';piano.currentTime=0;if(voice.src)voice.currentTime=0;cancelAnimationFrame(raf);updateHead()}
function pickMime(){const opts=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];return opts.find(x=>MediaRecorder.isTypeSupported?.(x))||''}
function blobToBase64(blob){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(String(fr.result).split(',')[1]);fr.onerror=reject;fr.readAsDataURL(blob)})}
async function startRecording(){if(mediaRecorder?.state==='recording'){mediaRecorder.stop();return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){setStatus('Este navegador no permite grabación MediaRecorder',true);return}try{setStatus('Solicitando micrófono…');micStream=await navigator.mediaDevices.getUserMedia({audio:true});const mime=pickMime();mediaRecorder=new MediaRecorder(micStream,mime?{mimeType:mime}:undefined);chunks=[];recordStart=piano.currentTime||0;mediaRecorder.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};mediaRecorder.onstop=saveRecording;mediaRecorder.start(500);$('record').classList.add('live');$('record').textContent='■ PARAR';$('recbadge').classList.add('on');if(!playing)playPause();setStatus('Grabando VOZ · micrófono activo')}catch(e){micStream?.getTracks().forEach(t=>t.stop());micStream=null;setStatus(`Micrófono no disponible · ${e.message}`,true)}}
async function saveRecording(){try{const type=mediaRecorder?.mimeType||chunks[0]?.type||'audio/webm';const blob=new Blob(chunks,{type});micStream?.getTracks().forEach(t=>t.stop());micStream=null;$('record').classList.remove('live');$('record').textContent='● GRABAR';$('recbadge').classList.remove('on');setStatus('Guardando toma…');const audio_base64=await blobToBase64(blob);const r=await fetch(RECORD_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'VOZ',mime_type:type,audio_base64})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.detail||j.error||`HTTP ${r.status}`);voiceTake=j.recording;voiceTake.duration=Number(voiceTake.duration)||0;if(voice.src)URL.revokeObjectURL(voice.src);voice.src=URL.createObjectURL(blob);renderTracks();saveState.textContent=`Guardada · ${voiceTake.id}`;setStatus('Toma de VOZ guardada en el proyecto')}catch(e){setStatus(`Error guardando VOZ · ${e.message}`,true)}finally{chunks=[];mediaRecorder=null}}
function setAuto(on){clearInterval(autoTimer);autoTimer=0;localStorage.setItem(AUTO_KEY,on?'1':'0');$('auto').classList.toggle('on',on);$('auto').textContent=on?'AUTO · ON':'AUTO';if(on)autoTimer=setInterval(()=>loadProject(true),5000)}
$('play').onclick=playPause;$('stop').onclick=stopAll;$('record').onclick=startRecording;$('refresh').onclick=()=>loadProject(false);$('auto').onclick=()=>setAuto(!$('auto').classList.contains('on'));
timeline.addEventListener('click',e=>{if(e.target.closest('button')||!duration)return;const r=timeline.getBoundingClientRect(),x=Math.max(0,Math.min(r.width,e.clientX-r.left));piano.currentTime=x/r.width*duration;updateHead()});
piano.addEventListener('ended',stopAll);addEventListener('beforeunload',()=>{micStream?.getTracks().forEach(t=>t.stop());clearInterval(autoTimer)});
loadProject(false).then(()=>setAuto(localStorage.getItem(AUTO_KEY)==='1'));
})();
</script>
</body>
</html>
