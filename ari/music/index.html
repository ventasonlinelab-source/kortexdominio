<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#e8decf"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>A.R.I. · Music DAW</title>
<style>
:root{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:light;
  --bg:#e8decf;--chrome:#f4eadb;--chrome2:#eadfce;--panel:#f7efe3;--panel2:#f2e7d7;
  --grid:#e2d4c1;--grid-strong:#c5b294;--line:#d3c2aa;--text:#2d261f;--muted:#7f705e;
  --accent:#a9792d;--accent-soft:#ead9b8;--record:#c85a55;--record-soft:#f3d8d2;
  --audio:#b87a48;--midi:#8f8a55;--selected:#9a6c2b;--headerw:196px;--barw:104px;
}
html[data-theme="dark"]{
  color-scheme:dark;--bg:#161816;--chrome:#202320;--chrome2:#1b1e1b;--panel:#242724;--panel2:#20231f;
  --grid:#2c302c;--grid-strong:#414641;--line:#353a35;--text:#eeeee9;--muted:#999d98;
  --accent:#d2a24c;--accent-soft:#3a3121;--record:#e46c68;--record-soft:#442827;
  --audio:#b77e58;--midi:#99955f;--selected:#d2a24c;
}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.shell{height:100dvh;display:grid;grid-template-rows:50px 44px minmax(0,1fr) 170px 58px;background:var(--bg)}
.topbar{display:grid;grid-template-columns:220px 1fr 290px;align-items:center;padding:0 12px;border-bottom:1px solid var(--line);background:var(--chrome)}
.brand{display:flex;align-items:center;gap:9px;min-width:0}.brand img{width:28px;height:28px}.brand-title{font-weight:900;font-size:13px}.brand-sub{font-size:8px;color:var(--muted);letter-spacing:.13em;text-transform:uppercase}
.project{justify-self:center;display:flex;align-items:center;gap:7px;min-width:0}.project input{width:170px;border:1px solid transparent;background:transparent;border-radius:5px;padding:5px 7px;text-align:center;font-size:11px;font-weight:800}.project input:focus{border-color:var(--line);background:var(--panel)}
.top-actions{display:flex;justify-content:flex-end;align-items:center;gap:6px}.status{font-size:9px;color:var(--muted);white-space:nowrap}.iconbtn,.smallbtn{height:30px;border:1px solid var(--line);background:var(--panel);border-radius:6px;font-size:10px;font-weight:800}.iconbtn{width:32px}.smallbtn{padding:0 9px}.smallbtn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.transport{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 12px;border-bottom:1px solid var(--line);background:var(--chrome2)}
.transport-left,.transport-right,.transport-center{display:flex;align-items:center;gap:6px}.transport-right{justify-content:flex-end}.transport-center{justify-content:center}
.field-inline{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:9px}.field-inline input{width:62px;height:28px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:0 7px;font-weight:800}
.tbtn{height:30px;min-width:34px;border:1px solid var(--line);background:var(--panel);border-radius:6px;font-weight:900}.tbtn.play.active{background:var(--text);color:var(--chrome);border-color:var(--text)}.tbtn.record{padding:0 10px;color:var(--record);background:var(--record-soft);border-color:color-mix(in srgb,var(--record) 55%,var(--line))}.tbtn.record.active{background:var(--record);color:white}.clock{min-width:80px;text-align:right;font-variant-numeric:tabular-nums;font-size:10px;font-weight:800}
.workspace{display:grid;grid-template-columns:188px minmax(0,1fr);min-height:0}
.browser{border-right:1px solid var(--line);background:var(--chrome);overflow:auto;padding:9px}.browser h3{font-size:9px;color:var(--muted);letter-spacing:.12em;margin:11px 3px 6px;text-transform:uppercase}.browser h3:first-child{margin-top:2px}
.browser-btn{width:100%;height:34px;border:1px solid transparent;background:transparent;border-radius:6px;text-align:left;padding:0 9px;font-size:10px;font-weight:750;display:flex;align-items:center;gap:8px}.browser-btn:hover,.browser-btn.active{background:var(--chrome2);border-color:var(--line)}.browser-btn strong{width:18px;text-align:center;color:var(--accent)}
.add-track{width:100%;height:38px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:7px;font-weight:900;font-size:10px;margin-bottom:8px}
.arrangement{min-width:0;min-height:0;background:var(--panel);position:relative;overflow:auto}
.arr-inner{position:relative;min-width:calc(var(--headerw) + 32 * var(--barw));min-height:100%}
.ruler-row{height:30px;position:sticky;top:0;z-index:9;display:grid;grid-template-columns:var(--headerw) calc(32 * var(--barw));background:var(--chrome2);border-bottom:1px solid var(--line)}
.ruler-head{position:sticky;left:0;z-index:12;background:var(--chrome2);border-right:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:9px;color:var(--muted)}
.ruler{position:relative;background-image:repeating-linear-gradient(to right,transparent 0,transparent calc(var(--barw) - 1px),var(--grid-strong) calc(var(--barw) - 1px),var(--grid-strong) var(--barw))}
.ruler-label{position:absolute;top:8px;font-size:8px;color:var(--muted);transform:translateX(5px)}
.track-row{height:58px;display:grid;grid-template-columns:var(--headerw) calc(32 * var(--barw));border-bottom:1px solid var(--line)}
.track-head{position:sticky;left:0;z-index:7;background:var(--chrome);border-right:1px solid var(--line);padding:5px 6px;display:grid;grid-template-columns:1fr auto;grid-template-rows:22px 22px;gap:3px 5px}
.track-head.selected{box-shadow:inset 3px 0 0 var(--selected)}.track-name{min-width:0;border:0;background:transparent;font-size:10px;font-weight:850;padding:0 3px}.track-type{font-size:8px;color:var(--muted);align-self:center}
.track-buttons{display:flex;gap:3px}.mini-toggle{width:23px;height:21px;border:1px solid var(--line);background:var(--panel);border-radius:4px;font-size:8px;font-weight:900;padding:0}.mini-toggle.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}.mini-toggle.arm.on{background:var(--record-soft);border-color:var(--record);color:var(--record)}
.mixers{grid-column:1/-1;display:grid;grid-template-columns:1fr 56px;align-items:center;gap:5px}.mixers input[type=range]{width:100%;height:16px;accent-color:var(--accent)}.pan{font-size:8px;color:var(--muted);text-align:right}
.lane{position:relative;overflow:hidden;background-image:repeating-linear-gradient(to right,transparent 0,transparent calc(var(--barw) - 1px),var(--grid) calc(var(--barw) - 1px),var(--grid) var(--barw)),repeating-linear-gradient(to right,transparent 0,transparent calc(var(--barw)/4 - 1px),color-mix(in srgb,var(--grid) 55%,transparent) calc(var(--barw)/4 - 1px),color-mix(in srgb,var(--grid) 55%,transparent) calc(var(--barw)/4))}
.lane:hover{background-color:color-mix(in srgb,var(--accent-soft) 18%,transparent)}
.clip{position:absolute;top:6px;height:45px;border:1px solid color-mix(in srgb,var(--text) 20%,transparent);border-radius:5px;overflow:hidden;user-select:none;touch-action:none;cursor:grab;box-shadow:0 1px 1px rgba(0,0,0,.08)}.clip.audio{background:color-mix(in srgb,var(--audio) 70%,var(--panel));}.clip.midi{background:color-mix(in srgb,var(--midi) 70%,var(--panel))}.clip.selected{outline:2px solid var(--selected);outline-offset:-2px}.clip-title{position:absolute;left:6px;top:4px;font-size:8px;font-weight:900;white-space:nowrap;z-index:2}.wave{position:absolute;inset:15px 5px 4px;opacity:.55;background:repeating-linear-gradient(90deg,transparent 0 3px,currentColor 3px 4px);mask-image:linear-gradient(to bottom,transparent 0,black 15%,black 85%,transparent 100%)}.midi-notes{position:absolute;inset:16px 4px 4px}.midi-note-preview{position:absolute;height:3px;border-radius:2px;background:currentColor;opacity:.65}.resize-handle{position:absolute;top:0;right:0;width:8px;height:100%;cursor:ew-resize;background:linear-gradient(to left,color-mix(in srgb,var(--text) 14%,transparent),transparent)}
.playhead{position:absolute;top:0;bottom:0;width:1px;background:var(--accent);z-index:8;pointer-events:none}.playhead:before{content:'';position:absolute;top:0;left:-4px;border-left:4px solid transparent;border-right:4px solid transparent;border-top:7px solid var(--accent)}
.empty{position:absolute;left:calc(var(--headerw) + 50%);top:45%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);pointer-events:none}.empty strong{display:block;color:var(--text);font-size:14px;margin-bottom:5px}.empty span{font-size:10px}
.inspector{border-top:1px solid var(--line);background:var(--chrome2);min-height:0;display:grid;grid-template-rows:32px minmax(0,1fr)}.inspector-head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:0 9px}.tabs{display:flex;align-items:center;gap:4px}.tab{height:24px;border:0;background:transparent;border-radius:5px;padding:0 9px;font-size:8px;font-weight:900;color:var(--muted)}.tab.active{background:var(--panel);color:var(--accent)}.inspect-toggle{border:0;background:transparent;color:var(--muted)}
.inspector-body{overflow:auto;padding:8px 10px}.inspector-empty{font-size:10px;color:var(--muted);padding:12px}
.clip-editor{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.edit-field{display:flex;align-items:center;gap:5px;font-size:8px;color:var(--muted)}.edit-field input,.edit-field select{height:28px;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:0 7px;font-size:9px}.danger{border-color:var(--record)!important;color:var(--record)!important}
.device-chain{display:flex;align-items:stretch;gap:7px;overflow:auto}.device{min-width:128px;border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:8px}.device strong{font-size:9px}.device small{display:block;color:var(--muted);font-size:7px;margin-top:4px}.device input{width:100%;accent-color:var(--accent)}
.piano-wrap{display:grid;grid-template-columns:48px minmax(650px,1fr);height:118px;overflow:auto;border:1px solid var(--line);background:var(--panel)}.keys,.roll{position:relative}.keys{position:sticky;left:0;z-index:3;background:var(--chrome)}.key{height:18px;border-bottom:1px solid var(--line);font-size:7px;padding:3px 5px;color:var(--muted)}.roll{min-width:900px;background-image:repeating-linear-gradient(to right,transparent 0,transparent calc(6.25% - 1px),var(--grid) calc(6.25% - 1px),var(--grid) 6.25%),repeating-linear-gradient(to bottom,transparent 0,transparent 17px,var(--line) 17px,var(--line) 18px)}.roll-note{position:absolute;height:14px;background:var(--midi);border-radius:3px;border:1px solid color-mix(in srgb,var(--text) 18%,transparent);cursor:pointer}
.bottom{display:grid;grid-template-columns:repeat(5,1fr);align-items:center;border-top:1px solid var(--line);background:var(--chrome);padding:4px max(10px,env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.nav{appearance:none;border:0;background:transparent;text-decoration:none;text-align:center;color:var(--muted);font-size:9px;font-weight:700}.nav b{display:block;font-size:15px;line-height:1.05;margin-bottom:2px}.nav.active{color:var(--accent)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.28);display:grid;place-items:center;padding:20px}.modal[hidden]{display:none}.dialog{width:min(420px,100%);border:1px solid var(--line);background:var(--chrome);border-radius:12px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.28)}.dialog h2{font-size:14px;margin:0 0 10px}.track-types{display:grid;grid-template-columns:1fr 1fr;gap:8px}.type-card{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:16px 10px;text-align:left}.type-card strong{display:block;font-size:11px}.type-card span{font-size:8px;color:var(--muted)}
.toast{position:fixed;right:14px;bottom:72px;z-index:80;background:var(--text);color:var(--panel);padding:9px 11px;border-radius:8px;font-size:9px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:none}
@media(max-width:820px){:root{--headerw:168px;--barw:86px}.topbar{grid-template-columns:150px 1fr 150px}.project input{width:120px}.status{display:none}.workspace{grid-template-columns:52px 1fr}.browser{padding:6px}.browser h3,.browser-btn span{display:none}.browser-btn{padding:0;justify-content:center}.browser-btn strong{font-size:14px}.add-track{font-size:0}.add-track:after{content:'+';font-size:18px}.shell{grid-template-rows:48px 42px minmax(0,1fr) 150px 56px}}
@media(max-width:560px){:root{--headerw:150px;--barw:76px}.topbar{grid-template-columns:1fr auto}.project{display:none}.top-actions .smallbtn{display:none}.transport{grid-template-columns:1fr auto}.transport-left .field-inline:nth-child(n+2){display:none}.transport-center{justify-content:flex-start}.transport-right{justify-content:flex-end}.transport-right .smallbtn{display:none}.clock{min-width:58px}.shell{grid-template-rows:46px 42px minmax(0,1fr) 130px 54px}.track-types{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div class="brand"><img src="/ari/icon.svg" alt="A.R.I."><div><div class="brand-title">MÚSICA</div><div class="brand-sub">A.R.I. DAW · MOTOR PROPIO</div></div></div>
    <div class="project"><input id="projectName" value="Sin título" aria-label="Nombre del proyecto"></div>
    <div class="top-actions"><span class="status" id="saveStatus">LOCAL · LISTO</span><button class="smallbtn" id="saveProject">GUARDAR</button><button class="iconbtn" id="themeBtn" aria-label="Cambiar tema">◐</button><button class="iconbtn" id="menuBtn" aria-label="Menú">×</button></div>
  </header>
  <section class="transport">
    <div class="transport-left"><label class="field-inline">BPM <input id="bpm" type="number" min="20" max="300" step="1" value="72"></label><button class="smallbtn" id="meterBtn">4/4</button><button class="smallbtn" id="metroBtn">METRO</button><button class="smallbtn" id="loopBtn">LOOP</button></div>
    <div class="transport-center"><button class="tbtn" id="stopBtn" aria-label="Stop">■</button><button class="tbtn play" id="playBtn" aria-label="Play">▶</button><button class="tbtn record" id="recordBtn">● REC</button></div>
    <div class="transport-right"><button class="smallbtn" id="zoomOut">−</button><button class="smallbtn" id="zoomIn">＋</button><span class="clock" id="clock">1.1.1 · 00:00.0</span></div>
  </section>
  <section class="workspace">
    <aside class="browser">
      <button class="add-track" id="addTrack">＋ PISTA</button><h3>Instrumentos</h3>
      <button class="browser-btn" data-instrument="PIANO"><strong>♬</strong><span>PIANO</span></button><button class="browser-btn" data-instrument="PAD"><strong>≈</strong><span>PAD</span></button><button class="browser-btn" data-instrument="BASS"><strong>⌁</strong><span>BASS</span></button><button class="browser-btn" data-instrument="DRUMS"><strong>◉</strong><span>DRUM RACK</span></button><button class="browser-btn" data-instrument="SAMPLER"><strong>▤</strong><span>SAMPLER</span></button>
      <h3>Audio</h3><button class="browser-btn" id="importAudio"><strong>↥</strong><span>IMPORTAR AUDIO</span></button><input id="audioFile" type="file" accept="audio/*" hidden>
      <h3>Efectos</h3><button class="browser-btn" data-device="GAIN"><strong>G</strong><span>GAIN</span></button><button class="browser-btn" data-device="EQ"><strong>E</strong><span>EQ</span></button><button class="browser-btn" data-device="COMP"><strong>C</strong><span>COMPRESSOR</span></button><button class="browser-btn" data-device="FILTER"><strong>F</strong><span>FILTER</span></button><button class="browser-btn" data-device="REVERB"><strong>R</strong><span>REVERB</span></button><button class="browser-btn" data-device="DELAY"><strong>D</strong><span>DELAY</span></button>
    </aside>
    <section class="arrangement" id="arrangement"><div class="arr-inner" id="arrInner"><div class="ruler-row"><div class="ruler-head"><span>ARRANGEMENT</span><span id="barsLabel">32 BARS</span></div><div class="ruler" id="ruler"></div></div><div id="tracks"></div><div class="playhead" id="playhead"></div><div class="empty" id="emptyState"><strong>Arrangement vacío</strong><span>＋ PISTA para empezar · doble toque en una pista MIDI crea un clip.</span></div></div></section>
  </section>
  <section class="inspector" id="inspector"><div class="inspector-head"><div class="tabs"><button class="tab active" data-tab="clip">CLIP</button><button class="tab" data-tab="piano">PIANO ROLL</button><button class="tab" data-tab="devices">DISPOSITIVOS</button></div><button class="inspect-toggle" id="inspectToggle">⌄</button></div><div class="inspector-body" id="inspectorBody"><div class="inspector-empty">Selecciona una pista o un clip.</div></div></section>
  <nav class="bottom"><a class="nav ari-exit" href="/ari/#ahora"><b>⌂</b>Ahora</a><a class="nav ari-exit" href="/ari/#linea"><b>│</b>Línea</a><a class="nav ari-exit" href="/ari/#menu"><b>☰</b>Menú</a><a class="nav active" href="/ari/music/"><b>♫</b>Música</a><button class="nav" id="refreshApp" type="button"><b>↻</b>Actualizar</button></nav>
</main>
<div class="modal" id="trackModal" hidden><div class="dialog"><h2>Crear pista</h2><div class="track-types"><button class="type-card" data-create-track="audio"><strong>🎙 AUDIO</strong><span>Voz, micrófono, samples y grabaciones.</span></button><button class="type-card" data-create-track="instrument"><strong>♬ INSTRUMENTO</strong><span>Piano, pad, bass, drums o sampler.</span></button></div></div></div><div class="toast" id="toast"></div>
<script>
(()=>{
const THEME_KEY='ari-theme',CONTEXT_KEY='ari-context-system',PROJECT_KEY='ari-daw-project-v0';const BAR_BEATS=4,MAX_BARS=32,MIN_CLIP=.25;let barWidth=104,project=loadProject(),selectedTrackId=null,selectedClipId=null,inspectorTab='clip';let audioCtx=null,playing=false,startCtxTime=0,startBeat=0,currentBeat=0,raf=0,activeNodes=[],trackBuses=new Map();let recorder=null,recordStream=null,recordTrackId=null,recordStartBeat=0,recordStartedMs=0;const buffers=new Map();const $=id=>document.getElementById(id),clamp=(n,a,b)=>Math.max(a,Math.min(b,n)),uid=()=>crypto.randomUUID?.()||('id_'+Date.now()+'_'+Math.random().toString(36).slice(2));
function freshProject(){return{version:1,name:'Sin título',bpm:72,bars:MAX_BARS,meter:[4,4],metronome:false,loop:{on:false,start:0,end:16},tracks:[],updatedAt:new Date().toISOString()}}function loadProject(){try{const x=JSON.parse(localStorage.getItem(PROJECT_KEY)||'null');return x&&Array.isArray(x.tracks)?x:freshProject()}catch{return freshProject()}}function saveProject(silent=false){project.updatedAt=new Date().toISOString();localStorage.setItem(PROJECT_KEY,JSON.stringify(project));$('saveStatus').textContent='LOCAL · GUARDADO';if(!silent)flash('Proyecto guardado en este dispositivo')}function markDirty(){saveProject(true);$('saveStatus').textContent='LOCAL · GUARDADO'}function flash(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(flash.t);flash.t=setTimeout(()=>t.classList.remove('show'),1800)}
function storedTheme(){return localStorage.getItem(THEME_KEY)||'light'}function applyTheme(){const x=storedTheme(),dark=matchMedia('(prefers-color-scheme: dark)').matches,r=x==='auto'?(dark?'dark':'light'):x;document.documentElement.dataset.theme=r;document.querySelector('meta[name="theme-color"]').content=r==='dark'?'#161816':'#e8decf'}localStorage.setItem(CONTEXT_KEY,'music');applyTheme();addEventListener('storage',e=>{if(e.key===THEME_KEY)applyTheme()});
function secPerBeat(){return 60/project.bpm}function beatToPx(b){return b/BAR_BEATS*barWidth}function pxToBeat(px){return px/barWidth*BAR_BEATS}function snapBeat(b,step=.25){return Math.round(b/step)*step}function fmtClock(beat){const bar=Math.floor(beat/4)+1,within=beat%4,b=Math.floor(within)+1,six=Math.floor((within%1)*4)+1,sec=beat*secPerBeat();return`${bar}.${b}.${six} · ${String(Math.floor(sec/60)).padStart(2,'0')}:${(sec%60).toFixed(1).padStart(4,'0')}`}function currentTransportBeat(){if(!playing||!audioCtx)return currentBeat;return startBeat+(audioCtx.currentTime-startCtxTime)/secPerBeat()}async function ensureAudio(){if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});if(audioCtx.state==='suspended')await audioCtx.resume();return audioCtx}function anySolo(){return project.tracks.some(t=>t.solo)}

function renderAll(){document.documentElement.style.setProperty('--barw',barWidth+'px');$('projectName').value=project.name;$('bpm').value=project.bpm;$('metroBtn').classList.toggle('active',project.metronome);$('loopBtn').classList.toggle('active',project.loop.on);renderRuler();renderTracks();renderInspector();paintPlayhead()}function setZoom(v){barWidth=clamp(v,52,180);renderAll()}
$('addTrack').onclick=()=>$('trackModal').hidden=false;$('trackModal').onclick=e=>{if(e.target===$('trackModal'))$('trackModal').hidden=true};document.querySelectorAll('[data-create-track]').forEach(b=>b.onclick=()=>{$('trackModal').hidden=true;addTrack(b.dataset.createTrack)});document.querySelectorAll('[data-instrument]').forEach(b=>b.onclick=()=>chooseInstrument(b.dataset.instrument));document.querySelectorAll('[data-device]').forEach(b=>b.onclick=()=>addDevice(b.dataset.device));$('importAudio').onclick=()=>$('audioFile').click();$('audioFile').onchange=e=>{importAudioFile(e.target.files?.[0]);e.target.value=''};$('projectName').onchange=e=>{project.name=e.target.value.trim()||'Sin título';markDirty()};$('bpm').onchange=e=>{project.bpm=clamp(+e.target.value||72,20,300);markDirty();if(playing){pause();play()}renderAll()};$('metroBtn').onclick=()=>{project.metronome=!project.metronome;markDirty();if(playing){pause();play()}renderAll()};$('loopBtn').onclick=()=>{project.loop.on=!project.loop.on;markDirty();renderAll()};$('playBtn').onclick=togglePlay;$('stopBtn').onclick=stop;$('recordBtn').onclick=startRecording;$('zoomIn').onclick=()=>setZoom(barWidth+14);$('zoomOut').onclick=()=>setZoom(barWidth-14);$('saveProject').onclick=()=>saveProject();$('menuBtn').onclick=()=>location.assign('/ari/#menu');$('themeBtn').onclick=()=>{const n=storedTheme()==='light'?'dark':storedTheme()==='dark'?'auto':'light';localStorage.setItem(THEME_KEY,n);applyTheme()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{inspectorTab=b.dataset.tab;renderInspector()});$('inspectToggle').onclick=()=>flash('Panel de edición');document.querySelectorAll('.ari-exit').forEach(a=>a.addEventListener('click',()=>sessionStorage.setItem('ari-music-resume','1')));addEventListener('beforeunload',()=>{recordStream?.getTracks().forEach(x=>x.stop());stopScheduled()});(async()=>{renderAll();for(const t of project.tracks)for(const c of t.clips)if(c.type==='audio')ensureBuffer(c).catch(()=>{})})();
})();
