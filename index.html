<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0b0d10" />
<link rel="manifest" href="/manifest.webmanifest" />
<title>WhatsApp · Pendientes</title>
<style>
:root{--bg:#0b0d10;--panel:#11151a;--line:#232a33;--text:#f5f7fa;--muted:#8993a1;--green:#25D366;--soft:#171c22;--audio:#1a2b22;--chip:#161b21;--chipon:#203428}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#101419 0,#090b0e 100%);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.wrap{width:min(760px,100%);margin:0 auto;padding:22px 16px 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.title{font-size:22px;font-weight:800;letter-spacing:-.5px}.count{display:inline-flex;min-width:22px;height:22px;align-items:center;justify-content:center;margin-left:7px;padding:0 6px;border-radius:999px;background:#203428;color:#caffd8;font-size:11px;vertical-align:2px}.status{display:flex;align-items:center;gap:7px;color:#b6c0cb;font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 12px rgba(37,211,102,.5)}.dot.off{background:#67717d;box-shadow:none}.notify{border:0;background:transparent;color:#7f8b98;font-size:11px;padding:2px 0;cursor:pointer}.subtitle{color:var(--muted);font-size:13px;margin-top:5px}.chips{display:flex;gap:8px;overflow:auto;padding:4px 0 18px}.chip{border:1px solid #29313a;background:var(--chip);color:#aab4c0;border-radius:999px;padding:7px 11px;font-size:11px;white-space:nowrap;cursor:pointer}.chip.active{background:var(--chipon);border-color:#2f5d41;color:#caffd8}.feed{display:grid;gap:10px}.item{background:rgba(17,21,26,.92);border:1px solid var(--line);border-radius:16px;padding:15px 16px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:10px}.person{font-weight:760;font-size:14px}.phone{font-size:11px;color:var(--muted);margin-top:3px}.time{font-size:11px;color:#73808f;white-space:nowrap}.group{display:inline-block;margin-left:7px;font-size:9px;padding:3px 6px;border-radius:999px;background:#1c232a;color:#9eabb8;border:1px solid #2c343e;vertical-align:1px}.message{font-size:14px;line-height:1.5;color:#e8edf3}.type{display:inline-flex;align-items:center;gap:6px;font-size:10px;text-transform:uppercase;letter-spacing:.65px;color:#8d98a6;margin-bottom:8px}.audio{background:var(--audio);border:1px solid #244534;border-radius:12px;padding:12px 13px}.trans-label{font-size:10px;color:#78a68a;text-transform:uppercase;letter-spacing:.65px;margin-bottom:6px}.transcript{font-size:14px;line-height:1.5;color:#eef7f1}.reply{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:13px;padding-top:12px;border-top:1px solid #202730}.reply input{width:100%;background:#151a20;border:1px solid #2a323c;color:#f4f7fa;border-radius:10px;padding:10px 11px;outline:none}.reply input:focus{border-color:#3a4b41}.send{border:0;background:var(--green);color:#07130b;border-radius:10px;padding:0 15px;font-weight:800;cursor:pointer}.send:disabled{opacity:.65;cursor:default}.sent{font-size:11px;color:#80d99a;margin-top:8px;display:none}.sent.error{color:#ff9d9d}.done{border:0;background:transparent;color:#65717e;font-size:10px;margin-top:8px;padding:0;cursor:pointer}.empty{border:1px dashed #2a323d;border-radius:16px;padding:28px;text-align:center;color:#6f7a88;font-size:13px;margin-top:12px}.note{font-size:10px;color:#5f6975;text-align:center;margin-top:18px}.hidden{display:none!important}
@media(max-width:560px){.wrap{padding:16px 12px 28px}.title{font-size:19px}.top{align-items:flex-start}.status{font-size:11px}.item{padding:14px}.message,.transcript{font-size:13px}.reply{grid-template-columns:1fr}.send{padding:10px 14px}}
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div><div class="title">Pendientes de WhatsApp <span class="count" id="count">0</span></div><div class="subtitle">Solo aparece lo nuevo que necesita tu atención</div></div>
    <div><div class="status"><span class="dot" id="dot"></span><span id="connection">WhatsApp conectado</span></div><button class="notify" id="notify" type="button">Activar avisos</button></div>
  </header>
  <nav class="chips" id="chips"></nav>
  <section class="feed" id="feed"></section>
  <div class="empty hidden" id="empty">No hay mensajes pendientes.</div>
  <div class="note">Datos en tiempo real · NocoDB</div>
</main>
<script>
const state={items:[],filter:'todos',seen:new Set(),booted:false};
const feed=document.getElementById('feed'),chips=document.getElementById('chips'),empty=document.getElementById('empty');
const count=document.getElementById('count'),dot=document.getElementById('dot'),connection=document.getElementById('connection'),notify=document.getElementById('notify');
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const grp=v=>{const x=String(v||'').trim().toLowerCase();return ['familia','amigos','clientes'].includes(x)?x:''};
const groupLabel=v=>v?({familia:'Familia',amigos:'Amigos',clientes:'Clientes'}[v]||v):'';
const fmt=t=>{const d=new Date(t);return Number.isNaN(d.getTime())?'':d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});};
function renderChips(){
  const counts={familia:0,amigos:0,clientes:0}; state.items.forEach(x=>{const g=grp(x.group);if(g)counts[g]++;});
  const defs=[['todos','Todos',state.items.length],['familia','Familia',counts.familia],['amigos','Amigos',counts.amigos],['clientes','Clientes',counts.clientes]].filter(([k,,n])=>k==='todos'||n>0);
  if(!defs.some(([k])=>k===state.filter)) state.filter='todos';
  chips.innerHTML=defs.map(([k,l,n])=>`<button class="chip ${k===state.filter?'active':''}" data-filter="${k}">${l} · ${n}</button>`).join('');
  chips.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;render();});
}
function card(x){
  const g=grp(x.group), label=groupLabel(g), name=x.sender||x.phone||'Sin nombre';
  const body=x.kind==='audio'?`<div class="type">🎤 Audio</div><div class="audio"><div class="trans-label">Transcripción</div><div class="transcript">${esc(x.transcription||'Transcripción no disponible')}</div></div>`:`<div class="type">● Texto</div><div class="message">${esc(x.text||'')}</div>`;
  return `<article class="item" data-id="${esc(x.message_id)}" data-group="${g}"><div class="head"><div><div class="person">${esc(name)} ${label?`<span class="group">${label}</span>`:''}</div><div class="phone">${esc(x.phone||x.wa_jid||'')}</div></div><div class="time">${esc(fmt(x.occurred_at))}</div></div>${body}<div class="reply"><input maxlength="4000" placeholder="Responder a ${esc(name)}…"><button class="send">Enviar</button></div><div class="sent"></div><button class="done" type="button">Marcar atendido</button></article>`;
}
function render(){
  renderChips(); count.textContent=state.items.length;
  const visible=state.items.filter(x=>state.filter==='todos'||grp(x.group)===state.filter);
  feed.innerHTML=visible.map(card).join(''); empty.classList.toggle('hidden',visible.length!==0);
  feed.querySelectorAll('.item').forEach(el=>{
    const id=el.dataset.id, item=state.items.find(x=>x.message_id===id); if(!item)return;
    const input=el.querySelector('input'),send=el.querySelector('.send'),sent=el.querySelector('.sent'),done=el.querySelector('.done');
    const submit=async()=>{const text=input.value.trim();if(!text){input.focus();return;}send.textContent='Enviando…';send.disabled=true;sent.className='sent';sent.style.display='block';sent.textContent='Enviando…';
      try{const r=await fetch('/api/reply',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({wa_jid:item.wa_jid,text,reply_to_message_id:item.message_id,client_request_id:crypto.randomUUID()})});const j=await r.json();if(!r.ok||!j.ok||j.status!=='enviado')throw new Error(j.error||'Error de envío');sent.textContent='✓ Enviado';setTimeout(refresh,650);}catch(e){sent.classList.add('error');sent.textContent='Error · '+e.message;send.textContent='Enviar';send.disabled=false;}};
    send.onclick=submit; input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submit();}};
    done.onclick=async()=>{done.disabled=true;try{const r=await fetch('/api/archive',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message_id:item.message_id})});if(!r.ok)throw new Error('archive');await refresh();}catch{done.disabled=false;}};
  });
}
async function refresh(){
  try{const r=await fetch('/api/pending',{cache:'no-store'});const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'API');
    const next=Array.isArray(j.pending)?j.pending:[]; const newIds=next.filter(x=>!state.seen.has(x.message_id)).map(x=>x.message_id); state.items=next; next.forEach(x=>state.seen.add(x.message_id));
    dot.classList.remove('off');connection.textContent='WhatsApp conectado';render();
    if(state.booted&&newIds.length) document.title=`(${state.items.length}) WhatsApp · Pendientes`; else document.title=state.items.length?`(${state.items.length}) WhatsApp · Pendientes`:'WhatsApp · Pendientes'; state.booted=true;
  }catch(e){dot.classList.add('off');connection.textContent='CRM sin conexión';}
}
function b64ToU8(s){const p='='.repeat((4-s.length%4)%4),b=(s+p).replace(/-/g,'+').replace(/_/g,'/'),raw=atob(b);return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));}
async function enablePush(promptUser=false){
  if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window)){notify.textContent='Avisos no disponibles';notify.disabled=true;return;}
  if(promptUser&&Notification.permission==='default') await Notification.requestPermission(); if(Notification.permission!=='granted'){notify.textContent=Notification.permission==='denied'?'Avisos bloqueados':'Activar avisos';return;}
  const reg=await navigator.serviceWorker.register('/sw.js'); const keyR=await fetch('/api/push-key',{cache:'no-store'}),keyJ=await keyR.json(); if(!keyR.ok||!keyJ.publicKey)throw new Error('push-key');
  let sub=await reg.pushManager.getSubscription(); if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(keyJ.publicKey)});
  const r=await fetch('/api/push-subscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({subscription:sub.toJSON()})});if(!r.ok)throw new Error('push-subscribe');notify.textContent='Avisos activos';
}
notify.onclick=()=>enablePush(true).catch(()=>{notify.textContent='Error avisos';});
if(Notification?.permission==='granted') enablePush(false).catch(()=>{});
refresh();setInterval(refresh,3000);
</script>
</body>
</html>
